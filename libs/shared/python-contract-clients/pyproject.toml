[project]
name = "blockout-contract-clients"
version = "0.0.0"
description = "Private generated Python clients for Blockout contracts"
requires-python = ">=3.14,<3.15"
dependencies = [
    "httpx>=0.28.1,<1",
    "pydantic>=2,<3",
    "python-dateutil>=2.8.2",
    "typing-extensions>=4.7.1",
]

[build-system]
requires = ["uv-build==0.11.32"]
build-backend = "uv_build"
