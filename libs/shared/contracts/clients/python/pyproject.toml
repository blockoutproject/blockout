[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blockout-contract-clients"
version = "0.1.0"
description = "Generated asynchronous OpenAPI clients for Blockout-owned services"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.8.4,<4",
  "aiohttp-retry>=2.8.3,<3",
  "pydantic>=2.11,<3",
  "python-dateutil>=2.8.2,<3",
  "typing-extensions>=4.7.1,<5",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["blockout_contract_clients*"]
