services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-admin-only
      POSTGRES_DB: postgres
      BLOCKOUT_APP_PASSWORD: local-app-only
      BLOCKOUT_MIGRATION_PASSWORD: local-migration-only
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init-roles.sql:/docker-entrypoint-initdb.d/10-blockout.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blockout"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
