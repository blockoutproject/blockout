server:
  port: 8083

spring:
  application:
    name: matches
  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    url: jdbc:postgresql://localhost:5434/blockout_matches
    username: blockout_matches
    password: blockout_matches
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update  
    show-sql: false  
    database-platform: org.hibernate.dialect.PostgreSQLDialect 