server:
  port: 8082

spring:
  application:
    name: teams
  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    url: jdbc:postgresql://localhost:5433/blockout_teams
    username: blockout_teams
    password: blockout_teams
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update  
    show-sql: true  
    database-platform: org.hibernate.dialect.PostgreSQLDialect 