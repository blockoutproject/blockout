server:
  port: 8083

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:matches}

  jackson:
    property-naming-strategy: SNAKE_CASE

  config:
    on-missing-location: fail

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/blockout_matches}
    username: ${SPRING_DATASOURCE_USERNAME:blockout_matches}
    password: ${SPRING_DATASOURCE_PASSWORD:blockout_matches}
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:user}
    password: ${SPRING_RABBITMQ_PASSWORD:password}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}