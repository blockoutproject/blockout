server:
  port: 8089

spring:
  application:
    name: ${APPLICATION_NAME:mobilegateway}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER}

  jackson:
    property-naming-strategy: SNAKE_CASE

  config:
    import: optional:file:.env.local[.properties]
    on-missing-location: fail

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}

api:
  match:
    url: ${MATCH_API_URL}
  team:
    url: ${TEAM_API_URL}
  pool:
    url: ${POOL_API_URL}
  config:
    url: ${CONFIG_API_URL}
  competition:
    url: ${COMPETITION_API_URL}
  club:
    url: ${CLUB_API_URL}
  notification:
    url: ${NOTIFICATION_API_URL}