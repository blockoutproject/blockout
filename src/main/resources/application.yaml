server:
  port: 8081

spring:
  application:
    name: ${SPRING_APPLICATION_NAME:pools}

  jackson:
    property-naming-strategy: SNAKE_CASE

  config:
    import: optional:file:.env.local[.properties]
    on-missing-location: fail

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/blockout_pools}
    username: ${SPRING_DATASOURCE_USERNAME:blockout_pools}
    password: ${SPRING_DATASOURCE_PASSWORD:blockout_pools}
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:user}
    password: ${SPRING_RABBITMQ_PASSWORD:password}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}

okta:
  oauth2:
    issuer: ${SPRING_AUTH0_ISSUER}
    audience: ${SPRING_AUTH0_AUDIENCE}