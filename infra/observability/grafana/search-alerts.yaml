# Native Grafana reference: replace datasource UIDs/environment with actual provider values.
# Grafana Cloud has no file provisioning; create the equivalent native rule through its UI.
apiVersion: 1
groups:
  - orgId: 1
    name: search-projection
    folder: Blockout
    interval: 1m
    rules:
      - uid: blockout-search-projection-failed
        title: Search projection failed
        condition: D
        for: 0s
        noDataState: NoData
        execErrState: Error
        data:
          - refId: A
            datasourceUid: ${LOKI_DATASOURCE_UID}
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: loki
                uid: ${LOKI_DATASOURCE_UID}
              editorMode: code
              expr: sum(count_over_time({environment="${BLOCKOUT_ENVIRONMENT}",service_name="blockout-backend"} | json | operation="search_projection" | outcome="failed" [5m])) or vector(0)
              instant: true
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: ${PROMETHEUS_DATASOURCE_UID}
            relativeTimeRange:
              from: 300
              to: 0
            model:
              datasource:
                type: prometheus
                uid: ${PROMETHEUS_DATASOURCE_UID}
              editorMode: code
              expr: max(search_projection_last_success_time_seconds{service_name="blockout-backend",deployment_environment_name="${BLOCKOUT_ENVIRONMENT}"})
              instant: true
              range: false
              refId: B
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: math
              # Native provisioning escapes dollars; enter $A + (0 * $B) in the Cloud UI.
              expression: $$A + (0 * $$B)
              refId: C
          - refId: D
            datasourceUid: __expr__
            relativeTimeRange:
              from: 0
              to: 0
            model:
              type: threshold
              expression: C
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  reducer:
                    type: last
                  type: query
              refId: D
        labels:
          environment: ${BLOCKOUT_ENVIRONMENT}
          service_name: blockout-backend
        annotations:
          summary: A targeted, full, submission or cleanup operation failed.
          description: Inspect safe stage/outcome and last_success_at, then current aliases and actual search. Resolution is not proof of reconstruction.
