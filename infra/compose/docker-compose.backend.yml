name: blockout-foundation
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: blockout
      POSTGRES_USER: blockout_bootstrap
      POSTGRES_PASSWORD: local-bootstrap
    volumes:
      - foundation-data:/var/lib/postgresql/data
      - ./backend/bootstrap.sql:/docker-entrypoint-initdb.d/001-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blockout_bootstrap -d blockout"]
      interval: 2s
      timeout: 2s
      retries: 30
    mem_limit: 512m
    cpus: 1
  migrations:
    image: migrations:local
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://database:5432/blockout
      LIQUIBASE_COMMAND_USERNAME: blockout_migration
      LIQUIBASE_COMMAND_PASSWORD: local-migration
      LIQUIBASE_LIQUIBASE_SCHEMA_NAME: migrations
    depends_on:
      database:
        condition: service_healthy
    restart: "no"
    mem_limit: 512m
    cpus: 1
  core-service:
    image: core-service:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/blockout
      SPRING_DATASOURCE_USERNAME: blockout_api
      SPRING_DATASOURCE_PASSWORD: local-api
      BLOCKOUT_REVENUECAT_WEBHOOK_AUTHORIZATION: ${BLOCKOUT_REVENUECAT_WEBHOOK_AUTHORIZATION:-local-unconfigured}
      BLOCKOUT_IDENTITY_NATIVE_CLIENT_IDS: ${BLOCKOUT_IDENTITY_NATIVE_CLIENT_IDS:-local-native-client}
      BLOCKOUT_IDENTITY_AUTH0_BASE_URL: ${BLOCKOUT_IDENTITY_AUTH0_BASE_URL:-https://blockout.invalid}
      BLOCKOUT_IDENTITY_AUTH0_CLIENT_ID: ${BLOCKOUT_IDENTITY_AUTH0_CLIENT_ID:-local-unconfigured}
      BLOCKOUT_IDENTITY_AUTH0_CLIENT_SECRET: ${BLOCKOUT_IDENTITY_AUTH0_CLIENT_SECRET:-local-unconfigured}
      BLOCKOUT_IDENTITY_BILLING_PROJECT_ID: ${BLOCKOUT_IDENTITY_BILLING_PROJECT_ID:-local-unconfigured}
      BLOCKOUT_IDENTITY_BILLING_ENVIRONMENT: ${BLOCKOUT_IDENTITY_BILLING_ENVIRONMENT:-sandbox}
      BLOCKOUT_AUTH_ISSUER: ${BLOCKOUT_AUTH_ISSUER:-https://blockout.invalid/}
      BLOCKOUT_AUTH_AUDIENCE: ${BLOCKOUT_AUTH_AUDIENCE:-https://api.blockout.invalid/}
      BLOCKOUT_AUTH_JWK_SET_URI: ${BLOCKOUT_AUTH_JWK_SET_URI:-https://blockout.invalid/.well-known/jwks.json}
    ports:
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:19090:9090"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:9090/actuator/health/readiness",
        ]
      interval: 2s
      timeout: 3s
      retries: 60
    mem_limit: 768m
    cpus: 1
    stop_grace_period: 40s
  core-worker:
    image: core-worker:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/blockout
      SPRING_DATASOURCE_USERNAME: blockout_worker
      SPRING_DATASOURCE_PASSWORD: local-worker
      BLOCKOUT_REVENUECAT_BASE_URL: ${BLOCKOUT_REVENUECAT_BASE_URL:-https://api.revenuecat.com}
      BLOCKOUT_REVENUECAT_SECRET_KEY: ${BLOCKOUT_REVENUECAT_SECRET_KEY:-local-unconfigured}
      BLOCKOUT_REVENUECAT_ENTITLEMENT_ID: ${BLOCKOUT_REVENUECAT_ENTITLEMENT_ID:-local-unconfigured}
    ports:
      - "127.0.0.1:19091:9090"
    depends_on:
      migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:9090/actuator/health/readiness",
        ]
      interval: 2s
      timeout: 3s
      retries: 60
    mem_limit: 768m
    cpus: 1
    stop_grace_period: 40s
  subscription-fixture:
    image: python:3.13-alpine
    profiles: [subscription-smoke]
    command: [python, /fixture.py]
    volumes:
      - ../../scripts/backend-foundation/revenuecat-fixture.py:/fixture.py:ro
    ports:
      - "127.0.0.1:13081:8080"
    mem_limit: 64m
    cpus: 0.25
  prometheus:
    image: prom/prometheus:v3.13.3
    profiles: [observability]
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.retention.time=2d",
      ]
    volumes:
      - ./backend/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./backend/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./backend/alerts.test.yml:/etc/prometheus/alerts.test.yml:ro
    ports:
      - "127.0.0.1:13090:9090"
    depends_on:
      core-service:
        condition: service_healthy
      core-worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:9090/-/ready",
        ]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    cpus: 0.5
  grafana:
    image: grafana/grafana:13.2.1
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./backend/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./backend/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:13000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:3000/api/health",
        ]
      interval: 2s
      timeout: 3s
      retries: 60
    mem_limit: 512m
    cpus: 0.5
volumes:
  foundation-data:
