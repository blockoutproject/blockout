groups:
  - name: backend-foundation
    rules:
      - alert: BackendWorkStalled
        expr: blockout_jobs_oldest_available_seconds > 300
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Executable backend work has waited longer than five minutes
      - alert: BackendDeadWork
        expr: blockout_jobs_count{state="dead"} > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Backend work requires operator intervention
      - alert: BackendSchemaUnavailable
        expr: blockout_schema_ready == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Backend database or schema is unavailable
      - alert: BackendWorkerStopped
        expr: blockout_worker_ready == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Backend worker cannot make progress
      - alert: BackendProcessUnavailable
        expr: up{job=~"core-service|core-worker"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: Backend management endpoint is unavailable
