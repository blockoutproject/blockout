global:
  scrape_interval: 15s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: backend-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:9090"]
  - job_name: backend-worker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["worker:9090"]
