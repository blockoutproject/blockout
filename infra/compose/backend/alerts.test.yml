rule_files:
  - alerts.yml
evaluation_interval: 15s
tests:
  - name: Degraded foundation fires its operational alerts
    interval: 15s
    input_series:
      - series: 'up{job="core-service"}'
        values: "0+0x8"
      - series: 'blockout_worker_ready{job="core-worker"}'
        values: "0+0x8"
      - series: 'blockout_schema_ready{job="core-service",schema="identity"}'
        values: "0+0x8"
      - series: 'blockout_jobs_count{job="core-worker",state="dead"}'
        values: "1+0x8"
      - series: 'blockout_jobs_oldest_available_seconds{job="core-worker"}'
        values: "301+0x8"
    alert_rule_test:
      - eval_time: 2m
        alertname: BackendProcessUnavailable
        exp_alerts:
          - exp_labels: { job: core-service, severity: critical }
            exp_annotations:
              summary: Backend management endpoint is unavailable
      - eval_time: 2m
        alertname: BackendWorkerStopped
        exp_alerts:
          - exp_labels: { job: core-worker, severity: critical }
            exp_annotations:
              summary: Backend worker cannot make progress
      - eval_time: 2m
        alertname: BackendSchemaUnavailable
        exp_alerts:
          - exp_labels:
              { job: core-service, schema: identity, severity: critical }
            exp_annotations:
              summary: Backend database or schema is unavailable
      - eval_time: 2m
        alertname: BackendDeadWork
        exp_alerts:
          - exp_labels: { job: core-worker, state: dead, severity: warning }
            exp_annotations:
              summary: Backend work requires operator intervention
      - eval_time: 2m
        alertname: BackendWorkStalled
        exp_alerts:
          - exp_labels: { job: core-worker, severity: warning }
            exp_annotations:
              summary: Executable backend work has waited longer than five minutes
  - name: Healthy foundation has no operational alerts
    interval: 15s
    input_series:
      - series: 'up{job="core-service"}'
        values: "1+0x8"
      - series: 'blockout_worker_ready{job="core-worker"}'
        values: "1+0x8"
      - series: 'blockout_schema_ready{job="core-service",schema="identity"}'
        values: "1+0x8"
      - series: 'blockout_jobs_count{job="core-worker",state="dead"}'
        values: "0+0x8"
      - series: 'blockout_jobs_oldest_available_seconds{job="core-worker"}'
        values: "0+0x8"
    alert_rule_test:
      - { eval_time: 2m, alertname: BackendProcessUnavailable, exp_alerts: [] }
      - { eval_time: 2m, alertname: BackendWorkerStopped, exp_alerts: [] }
      - { eval_time: 2m, alertname: BackendSchemaUnavailable, exp_alerts: [] }
      - { eval_time: 2m, alertname: BackendDeadWork, exp_alerts: [] }
      - { eval_time: 2m, alertname: BackendWorkStalled, exp_alerts: [] }
  - name: Stale subscription evidence becomes actionable
    interval: 1m
    input_series:
      - series: 'blockout_subscription_stale_positive{job="core-worker"}'
        values: "1+0x10"
    alert_rule_test:
      - eval_time: 6m
        alertname: BackendSubscriptionEvidenceStale
        exp_alerts:
          - exp_labels: { job: core-worker, severity: warning }
            exp_annotations:
              summary: Positive subscription evidence is outside its freshness window
