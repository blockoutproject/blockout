services:
  blockout-postgres-pools:
    container_name: blockout-postgres-pools
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: blockout_pools
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: blockout_pools
    ports:
      - '5432:5432'
    volumes:
      - postgres_pools_data:/var/lib/postgresql/data
    networks:
      - blockout-network

  blockout-postgres-teams:
    container_name: blockout-postgres-teams
    image: postgres:17
    restart: always
    environment:
