name: blockout

services:
  blockout-postgres-pools:
    container_name: blockout-postgres-pools
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: pools
      POSTGRES_PASSWORD: pools
      POSTGRES_DB: pools
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pools -d pools"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_pools_data:/var/lib/postgresql/data
    networks:
      - blockout-network

  blockout-postgres-teams:
    container_name: blockout-postgres-teams
    image: postgres:17
