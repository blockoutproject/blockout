Options:
  parameters:
    - $ref: ./parameters.yaml#/Account
    - $ref: ../access/parameters.yaml#/MaintenanceBypass
  get:
    operationId: getFollowOptions
    tags:
      - Following
    summary: Read my follow season choices
    description:
      Returns the usable owner’s viewable catalog/follow seasons and ordinary default. Hidden follows
      alone expose no season. A read failure does not prove a retained selection unavailable.
    responses:
      "200":
        description: Current authorized representation.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/FollowOptionsResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "503":
        $ref: ../access/problems.yaml#/responses/AccessUnavailable
Matches:
  get:
    parameters:
      - $ref: ./parameters.yaml#/Account
      - $ref: ../access/parameters.yaml#/MaintenanceBypass
      - $ref: ./parameters.yaml#/Season
      - $ref: ../consultation/parameters.yaml#/Category
      - $ref: ../consultation/parameters.yaml#/TimeZone
      - $ref: ../consultation/parameters.yaml#/NextDay
    operationId: listPersonalMatches
    tags:
      - Following
    summary: Read my personal sporting calendar
    description:
      Returns the usable owner’s matches selected by a followed participant or pool, each once. Current
      visibility applies. Preserve season, category and timeZone for nextDay; concurrent moves can be absent until
      refresh. No general-calendar fallback.
    responses:
      "200":
        description: Current authorized representation.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/PersonalMatchCalendarResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "503":
        $ref: ../access/problems.yaml#/responses/AccessUnavailable
