StreamAccount:
  name: accountId
  in: path
  required: true
  description: Original owner account; must match the authenticated usable account.
  schema:
    type: string
    description: Original owner account; must match the authenticated usable account.
    format: uuid
StreamMatch:
  name: matchId
  in: path
  required: true
  description: Stable sporting match identity.
  schema:
    type: string
    description: Stable sporting match identity.
    format: uuid
StreamContribution:
  name: contributionId
  in: path
  required: true
  description: Exact contribution version identity; never resolve to a later active link.
  schema:
    type: string
    description: Exact contribution version identity; never resolve to a later active link.
    format: uuid
StreamPage:
  name: page
  in: query
  required: false
  description: Zero-based page of twenty elements; overflow or unsupported continuation returns 400.
  schema:
    type: integer
    description: Page index whose native twenty-item offset fits the persistence range.
    format: int64
    minimum: 0
    maximum: 107374182
    default: 0
StreamSeason:
  name: seasonId
  in: query
  required: false
  description: Restrict moderation to this season; omit for all seasons. Unknown season returns 404.
  schema:
    type: string
    description: Sporting season identity.
    format: uuid
StreamQuery:
  name: query
  in: query
  required: false
  description:
    Case-insensitive literal fragment in team names or recorded addresses; omitted or blank means
    no text filter.
  schema:
    type: string
    description: Literal search text, without wildcard operators.
StreamPlatform:
  name: platform
  in: query
  required: false
  description: Require a contribution from this platform.
  schema:
    $ref: ./schemas.yaml#/StreamPlatformEnum
StreamFilter:
  name: state
  in: query
  required: false
  description:
    Moderation selection; omission selects to-review. All matching criteria apply to a version of
    the match.
  schema:
    $ref: ./schemas.yaml#/StreamModerationFilterEnum
StreamVersionState:
  name: state
  in: query
  required: false
  description: Restrict paged versions to a lifecycle state or historical versions; omit for all versions.
  schema:
    $ref: ./schemas.yaml#/StreamVersionFilterEnum
