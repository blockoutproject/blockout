AccountResponse:
  type: object
  description: Private usable profile returned only to its owner.
  additionalProperties: true
  required:
    - accountId
    - username
    - email
    - principalCreatedAt
    - hasPhoto
  properties:
    accountId:
      type: string
      format: uuid
      description: Business identity of this account lifecycle.
    username:
      type: string
      description: Current unique display username.
      minLength: 3
      maxLength: 32
      pattern: ^[A-Za-z0-9._-]{3,32}$
    email:
      type: string
      description: Last usable provider email; not an account identifier or editable profile field.
      format: email
    principalCreatedAt:
      type: string
      format: date-time
      nullable: true
      description:
        Reliable principal creation instant for account-age rules; null means unknown,
        never a local creation-date fallback.
    hasPhoto:
      type: boolean
      description: Whether this account currently has an accepted private photo.
ChangeAccountProfileRequest:
  type: object
  description:
    Only changed fields. Omission preserves the current field; null is invalid. A username
    change or replace/remove photo action is required.
  additionalProperties: false
  properties:
    username:
      type: string
      description:
        "Outer whitespace is trimmed before validation: 3–32 ASCII letters, digits, dot,
        hyphen or underscore. Case-insensitive uniqueness is checked atomically."
    photoAction:
      type: string
      description:
        keep preserves the photo; replace requires one image part; remove deletes the photo
        and forbids an image. Omission is keep.
      enum:
        - keep
        - replace
        - remove
AccountErasureAcceptedResponse:
  type: object
  description: Minimal receipt for accepted erasure; no profile or supplier identifiers.
  additionalProperties: true
  required:
    - accountId
    - acceptedAt
  properties:
    accountId:
      type: string
      format: uuid
      description: Business identity of this account lifecycle.
    acceptedAt:
      type: string
      format: date-time
      description: UTC instant when erasure was durably accepted.
AccountErasurePendingResponse:
  description: Owner-only pending-erasure problem with a minimal acceptance receipt.
  allOf:
    - $ref: ../../common/problems.yaml#/schemas/ProblemResponse
    - type: object
      description:
        Pending erasure fields; type is urn:blockout:problem:account-erasure-pending and
        status is 409.
      additionalProperties: true
      required:
        - accountId
        - acceptedAt
      properties:
        accountId:
          type: string
          format: uuid
          description: Business identity of this account lifecycle.
        acceptedAt:
          type: string
          format: date-time
          description: UTC instant when erasure was durably accepted.
