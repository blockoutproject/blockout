Collection:
  post:
    operationId: establishAccount
    tags:
      - Accounts
    summary: Establish my account
    description:
      Creates the authenticated principal’s account or refreshes its necessary provider
      information after explicit sign-in. Never links by email. Repetition resolves the same account;
      pending erasure blocks creation. Existing known information survives temporary provider absence.
    responses:
      "400":
        $ref: ../../common/problems.yaml#/responses/400
      "401":
        $ref: ../../common/problems.yaml#/responses/401
      "403":
        $ref: ../../common/problems.yaml#/responses/403
      "422":
        $ref: ../../common/problems.yaml#/responses/422
      "503":
        $ref: ../../common/problems.yaml#/responses/503
      "200":
        description: Existing usable account.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/AccountResponse
      "201":
        description: New usable account.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
          Location:
            description: Address of the created account.
            schema:
              type: string
              format: uri-reference
              example: /accounts/6c0f08bf-56b1-4a1d-8c1e-52caab3ddc79
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/AccountResponse
      "409":
        $ref: "#/responses/ErasurePending"
Current:
  get:
    operationId: getMyAccount
    tags:
      - Accounts
    summary: Read my account
    description:
      Returns the authenticated principal’s existing account without creating it or synchronizing
      provider data. An absent profile requires explicit account establishment; pending erasure reveals
      only its minimal accepted-request state.
    responses:
      "401":
        $ref: ../../common/problems.yaml#/responses/401
      "403":
        $ref: ../../common/problems.yaml#/responses/403
      "404":
        $ref: ../../common/problems.yaml#/responses/404
      "503":
        $ref: ../../common/problems.yaml#/responses/503
      "200":
        description: Current owner profile.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/AccountResponse
      "409":
        $ref: "#/responses/ErasurePending"
Member:
  parameters:
    - name: accountId
      in: path
      required: true
      description: Original business account identity; never substitute a later account.
      schema:
        type: string
        format: uuid
  get:
    operationId: getAccount
    tags:
      - Accounts
    summary: Read my original account
    description:
      Returns only the caller’s account. A valid original owner can read minimal pending-erasure
      information despite ordinary access being blocked. A 404 means no accessible resource, not independent
      proof of physical supplier erasure.
    responses:
      "400":
        $ref: ../../common/problems.yaml#/responses/400
      "401":
        $ref: ../../common/problems.yaml#/responses/401
      "403":
        $ref: ../../common/problems.yaml#/responses/403
      "404":
        $ref: ../../common/problems.yaml#/responses/404
      "503":
        $ref: ../../common/problems.yaml#/responses/503
      "200":
        description: Current owner profile.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
          Accept-Patch:
            description: Supported atomic profile change media type.
            schema:
              type: string
              enum:
                - multipart/form-data
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/AccountResponse
      "409":
        $ref: "#/responses/ErasurePending"
  patch:
    operationId: changeAccountProfile
    tags:
      - Accounts
    summary: Change my profile
    description:
      Saves supplied username and photo changes atomically for the usable owner. Omitted
      fields preserve current values, including concurrent changes. Supplied values replace the last
      accepted value; no revision token is required. After an uncertain response, read this account
      before an explicit retry.
    responses:
      "400":
        $ref: ../../common/problems.yaml#/responses/400
      "401":
        $ref: ../../common/problems.yaml#/responses/401
      "403":
        $ref: ../../common/problems.yaml#/responses/403
      "404":
        $ref: ../../common/problems.yaml#/responses/404
      "409":
        $ref: ../../common/problems.yaml#/responses/409
      "413":
        $ref: ../../common/problems.yaml#/responses/413
      "415":
        $ref: ../../common/problems.yaml#/responses/415
      "422":
        $ref: ../../common/problems.yaml#/responses/422
      "503":
        $ref: ../../common/problems.yaml#/responses/503
      "200":
        description: Complete accepted profile.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/AccountResponse
    requestBody:
      required: true
      description:
        Atomic profile changes; not JSON Patch or JSON Merge Patch. At least one effective
        change field is required. A file is required only for photoAction=replace and forbidden otherwise.
      content:
        multipart/form-data:
          schema:
            type: object
            description: Changed profile fields and optional replacement image.
            additionalProperties: false
            required:
              - metadata
            properties:
              metadata:
                $ref: ./schemas.yaml#/ChangeAccountProfileRequest
              image:
                type: string
                format: binary
                description:
                  Square PNG/JPEG, 1–1024 pixels per side and at most 5242880 bytes; actual
                  decoded content is validated.
          encoding:
            metadata:
              contentType: application/json
            image:
              contentType: image/png, image/jpeg
  delete:
    operationId: eraseAccount
    tags:
      - Accounts
    summary: Request account erasure
    description:
      Accepts explicit erasure for the original owner, blocks ordinary access on all devices
      and removes local personal data before provider cleanup. Repeating a pending request returns
      its acceptance without restarting cleanup. Never targets a replacement account or cancels store
      billing.
    responses:
      "400":
        $ref: ../../common/problems.yaml#/responses/400
      "401":
        $ref: ../../common/problems.yaml#/responses/401
      "403":
        $ref: ../../common/problems.yaml#/responses/403
      "404":
        $ref: ../../common/problems.yaml#/responses/404
      "503":
        $ref: ../../common/problems.yaml#/responses/503
      "202":
        description:
          Durably accepted, not a claim of complete physical erasure. Read the original
          account for its minimal pending state; unresolved supplier work is handled through private
          support.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
          Location:
            description: Original account address for checking the pending outcome.
            schema:
              type: string
              format: uri-reference
              example: /accounts/6c0f08bf-56b1-4a1d-8c1e-52caab3ddc79
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/AccountErasureAcceptedResponse
Photo:
  parameters:
    - name: accountId
      in: path
      required: true
      description: Original business account identity; never substitute a later account.
      schema:
        type: string
        format: uuid
  get:
    operationId: getAccountPhoto
    tags:
      - Accounts
    summary: Read my profile photo
    description:
      Returns the usable owner’s accepted photo. A missing photo or inaccessible account
      returns 404. No public profile-image access is granted.
    responses:
      "400":
        $ref: ../../common/problems.yaml#/responses/400
      "401":
        $ref: ../../common/problems.yaml#/responses/401
      "403":
        $ref: ../../common/problems.yaml#/responses/403
      "404":
        $ref: ../../common/problems.yaml#/responses/404
      "503":
        $ref: ../../common/problems.yaml#/responses/503
      "200":
        description: Accepted photo bytes, without original metadata.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          image/png:
            schema:
              type: string
              format: binary
              description: Square accepted photo.
          image/jpeg:
            schema:
              type: string
              format: binary
              description: Square accepted photo.
responses:
  ErasurePending:
    description:
      Erasure is already accepted. Ordinary account access and recreation remain blocked;
      no provider cleanup is triggered by this read or repeated establishment.
    headers:
      Cache-Control:
        $ref: ../../common/headers.yaml#/NoStore
    content:
      application/problem+json:
        schema:
          $ref: ./schemas.yaml#/AccountErasurePendingResponse
