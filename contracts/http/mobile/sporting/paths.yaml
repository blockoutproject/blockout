PackClassification:
  get:
    operationId: getPackClassification
    tags:
      - SportingClassification
    summary: Read pack classification
    description: >-
      Returns the pack default, effective acquisition classification.
      Requires global sporting-classification permission; all affected resources remain subject to their business rules.
    responses:
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "200":
        description: >-
          Current authorized values.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/ClassificationDetailResponse"
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
    parameters:
      - name: packId
        in: path
        required: true
        description: Authorized pack identity.
        schema:
          type: string
          description: Authorized pack identity.
          format: uuid
  put:
    operationId: setPackClassification
    tags:
      - SportingClassification
    summary: Set pack classification
    description: >-
      Requires global sporting-classification permission; all affected resources remain subject to
      their business rules. Sets or removes the complete pack default atomically. Removing the pack
      default leaves pools without their own override unclassified for acquisition; individual
      overrides remain in effect. Without an effective classification, collection stops while
      accepted published classification remains. A conflicting shared participation
      or target-identity collision refuses the entire change without splitting or merging teams. A
      failed or lost response permits explicit manual retry without a verification read.
    responses:
      "415":
        $ref: ../../common/problems.yaml#/responses/UnsupportedMediaType
      "200":
        description: >-
          Updated values after the complete change is accepted.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/ClassificationDetailResponse"
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "409":
        $ref: ../../common/problems.yaml#/responses/Conflict
      "422":
        $ref: ../../common/problems.yaml#/responses/UnprocessableContent
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
    parameters:
      - name: packId
        in: path
        required: true
        description: Authorized pack identity.
        schema:
          type: string
          description: Authorized pack identity.
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./schemas.yaml#/SetClassificationRequest"
