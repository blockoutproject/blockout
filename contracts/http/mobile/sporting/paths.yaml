Divisions:
  get:
    operationId: listDivisions
    tags:
      - DivisionAdministration
    summary: List configured divisions
    description: >-
      Returns configured divisions ordered by case-folded name, then UUID. Inactive divisions are
      included only when requested. Requires sporting-presentation, sporting-classification or
      division-lifecycle permission.
    responses:
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "200":
        description: >-
          Configured divisions matching the requested activity filter.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/DivisionListResponse"
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
    parameters:
      - name: includeInactive
        in: query
        required: false
        description: Include inactive divisions for lifecycle management.
        schema:
          type: boolean
          default: false
  post:
    operationId: createDivision
    tags:
      - DivisionAdministration
    summary: Create a sporting division
    description: >-
      Requires division-lifecycle permission. Creates an active division with a case-insensitively
      unique name, colors and optional logo in one atomic save. replace requires a decodable
      PNG/JPEG image of at most 5242880 bytes and 4194304 pixels; keep and automatic forbid an image
      and create the division without a logo. A failed or lost response permits explicit manual
      retry without a verification read.
    responses:
      "201":
        description: >-
          Created active division.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
          Location:
            description: URI of the created division, returned on every successful creation.
            schema:
              type: string
              format: uri-reference
              example: /administration/divisions/7e747352-4b76-4676-bd17-a694c7c4fd88
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/DivisionResponse"
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "409":
        $ref: ../../common/problems.yaml#/responses/Conflict
      "422":
        $ref: ../../common/problems.yaml#/responses/UnprocessableContent
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
      "413":
        $ref: ../../common/problems.yaml#/responses/ContentTooLarge
      "415":
        $ref: ../../common/problems.yaml#/responses/UnsupportedMediaType
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            title: CreateDivisionMultipartRequest
            type: object
            description:
              One ordinary multipart editor submission; metadata JSON plus an optional binary
              image.
            additionalProperties: false
            properties:
              metadata:
                $ref: "./schemas.yaml#/CreateDivisionRequest"
              image:
                type: string
                description:
                  Image part only with logoAction=replace; actual PNG/JPEG bytes, at most
                  5 MiB and 4194304 pixels.
                format: binary
            required:
              - metadata
          encoding:
            metadata:
              contentType: application/json
            image:
              contentType: image/png, image/jpeg
Division:
  get:
    operationId: getDivision
    tags:
      - DivisionAdministration
    summary: Read a division
    description: >-
      Returns the division’s presentation and activity. Requires
