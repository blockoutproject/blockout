ClubPresentation:
  get:
    operationId: getClubPresentation
    tags:
      - Sporting
    summary: Read club presentation
    description: >-
      Returns the club's effective names, manual customizations and logo values, and current editing
      revision. Requires global sporting-presentation permission; resource conditions still apply.
    responses:
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "200":
        description: >-
          Current authorized values.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
          Accept-Patch:
            $ref: ../../common/headers.yaml#/AcceptPatchMultipart
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/SportingPresentationResponse"
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
    parameters:
      - name: clubId
        in: path
        required: true
        description: Stable club identity, including retained resources available to authorized administration.
        schema:
          type: string
          description: Stable club identity, including retained resources available to authorized administration.
          format: uuid
  patch:
    operationId: setClubPresentation
    tags:
      - Sporting
    summary: Set club names and logo
    description: >-
      Requires global sporting-presentation permission; resource conditions still apply. Saves the manual display name and
      logo action together, preserving source values and identity. replace requires a decodable
      PNG/JPEG image of at most 5242880 bytes; keep and automatic forbid an image. For a club,
      automatic clears its manual logo and selects missing artwork. A stale revision returns 409
      without changes. After an uncertain response, read current state before an explicit retry.
    responses:
      "200":
        description: >-
          Updated values after the complete change is accepted.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
          Accept-Patch:
            $ref: ../../common/headers.yaml#/AcceptPatchMultipart
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/SportingPresentationResponse"
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "409":
        $ref: ../../common/problems.yaml#/responses/Conflict
      "422":
        $ref: ../../common/problems.yaml#/responses/UnprocessableContent
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
      "413":
        $ref: ../../common/problems.yaml#/responses/ContentTooLarge
      "415":
        $ref: ../../common/problems.yaml#/responses/UnsupportedMediaType
    parameters:
      - name: clubId
        in: path
        required: true
        description: Stable club identity, including retained resources available to authorized administration.
        schema:
          type: string
          description: Stable club identity, including retained resources available to authorized administration.
          format: uuid
    requestBody:
      description: >-
        Atomic presentation changes encoded as JSON metadata and an optional image. All metadata
        fields remain required; logoAction=keep preserves only the existing logo. This is not a
        JSON Merge Patch or JSON Patch document.
      required: true
      content:
        multipart/form-data:
          schema:
            title: SetClubPresentationMultipartRequest
            type: object
            description:
              One ordinary multipart editor submission; metadata JSON plus an optional binary
              image.
            additionalProperties: false
            properties:
              metadata:
                $ref: "./schemas.yaml#/SetClubPresentationRequest"
              image:
                type: string
                description:
                  Image part only with logoAction=replace; actual PNG/JPEG bytes, at most
                  5 MiB.
                format: binary
            required:
              - metadata
          encoding:
            metadata:
              contentType: application/json
            image:
              contentType: image/png, image/jpeg
