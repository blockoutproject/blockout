    responses:
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "200":
        description: >-
          Current authorized values.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/DivisionResponse"
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
    parameters:
      - name: divisionId
        in: path
        required: true
        description: Stable division identity.
        schema:
          type: string
          description: Stable division identity.
          format: uuid
DivisionPresentation:
  patch:
    operationId: setDivisionPresentation
    tags:
      - SportingPresentation
    summary: Edit division presentation
    description: >-
      Requires sporting-presentation permission. Saves the name, colors and logo action together
      without changing identity or activity. Case-insensitive name uniqueness applies. replace
      requires a decodable PNG/JPEG image of at most 5242880 bytes and 4194304 pixels; keep and
      automatic forbid an image. automatic removes the manual logo without a team or club fallback.
      A failed or lost response permits explicit
      manual retry without a verification read.
    responses:
      "200":
        description: >-
          Updated values after the complete change is accepted.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
          Accept-Patch:
            $ref: ../../common/headers.yaml#/AcceptPatchMultipart
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/DivisionResponse"
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "409":
        $ref: ../../common/problems.yaml#/responses/Conflict
      "422":
        $ref: ../../common/problems.yaml#/responses/UnprocessableContent
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
      "413":
        $ref: ../../common/problems.yaml#/responses/ContentTooLarge
      "415":
        $ref: ../../common/problems.yaml#/responses/UnsupportedMediaType
    parameters:
      - name: divisionId
        in: path
        required: true
        description: Stable division identity.
        schema:
          type: string
          description: Stable division identity.
          format: uuid
    requestBody:
      description: >-
        Atomic presentation changes encoded as JSON metadata and an optional image. All metadata
        fields remain required; logoAction=keep preserves only the existing logo. This is not a
        JSON Merge Patch or JSON Patch document.
      required: true
      content:
        multipart/form-data:
          schema:
            title: SetDivisionPresentationMultipartRequest
            type: object
            description:
              One ordinary multipart editor submission; metadata JSON plus an optional binary
              image.
            additionalProperties: false
            properties:
              metadata:
                $ref: "./schemas.yaml#/SetDivisionPresentationRequest"
              image:
                type: string
                description:
                  Image part only with logoAction=replace; actual PNG/JPEG bytes, at most
                  5 MiB and 4194304 pixels.
                format: binary
            required:
              - metadata
          encoding:
            metadata:
              contentType: application/json
            image:
              contentType: image/png, image/jpeg
DivisionActivity:
  put:
    operationId: setDivisionActivity
    tags:
      - DivisionAdministration
    summary: Change division activity
    description: >-
      Requires division-lifecycle permission. Deactivation hides
      dependent sporting resources and prevents collection from the next acquisition cycle; clubs
      remain visible and already-running cycles may finish. Reactivation lifts only the inactivity
      restriction. A failed or lost response permits
      explicit manual retry without a verification read.
    responses:
      "415":
        $ref: ../../common/problems.yaml#/responses/UnsupportedMediaType
      "200":
        description: >-
          Updated values after the complete change is accepted.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: "./schemas.yaml#/DivisionResponse"
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "409":
        $ref: ../../common/problems.yaml#/responses/Conflict
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
    parameters:
      - name: divisionId
        in: path
        required: true
        description: Stable division identity.
        schema:
          type: string
          description: Stable division identity.
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "./schemas.yaml#/SetDivisionActivityRequest"
