  /administration/divisions:
    get:
      operationId: listDivisions
      tags:
        - Sporting
      summary: List configured divisions
      description:
        Requires the current division-management or sporting-classification grant. Deterministic
        configuration list, including inactive divisions only when explicitly requested.
      responses:
        "200":
          description: Accepted current projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DivisionListResponse"
        "401":
          $ref: ../common/problems.yaml#/responses/401
        "403":
          $ref: ../common/problems.yaml#/responses/403
        "503":
          $ref: ../common/problems.yaml#/responses/503
      parameters:
        - name: includeInactive
          in: query
          required: false
          description: Include inactive divisions for lifecycle management.
          schema:
            type: boolean
            default: false
    post:
      operationId: createDivision
      tags:
        - Sporting
      summary: Create a sporting division
      description: >-
        Requires the F12 division-management grant. Creates an active division with a case-insensitively unique name, colors and optional logo. After an uncertain response, reread the list before explicit retry. Metadata and optional image commit together. replace requires a decodable PNG/JPEG image of at most 5242880 bytes; keep and automatic forbid an image. automatic selects ordinary missing artwork; it does not inherit a team or club logo.
      responses:
        "201":
          description: Accepted current projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DivisionResponse"
        "400":
          $ref: ../common/problems.yaml#/responses/400
        "401":
          $ref: ../common/problems.yaml#/responses/401
        "403":
          $ref: ../common/problems.yaml#/responses/403
        "409":
          $ref: ../common/problems.yaml#/responses/409
        "422":
          $ref: ../common/problems.yaml#/responses/422
        "503":
