openapi: 3.0.4
info:
  title: Blockout mobile API
  version: 0.1.0
  description: >-
    Backend API for application access, account lifecycle, public sporting consultation and administration.
servers:
  - url: /
    description: Same-origin backend; deployment supplies its environment URL.
tags:
  - name: Collection
    description: Source qualification, collection control and current operational evidence.
  - name: ApplicationAccess
    description: Public admission settings and separately authorized maintenance/version management.
  - name: Accounts
    description: Private account establishment, profile changes and erasure.
  - name: Sporting
    description: >-
      Sporting identities, presentation, classification and authorized corrections.
security:
  - MobileToken: []
paths:
  /clubs/{clubId}:
    $ref: ./consultation/paths.yaml#/Club
  /clubs/{clubId}/teams:
    $ref: ./consultation/paths.yaml#/ClubTeams
  /clubs/{clubId}/logo:
    $ref: ./consultation/paths.yaml#/ClubLogo
  /teams/{teamId}:
    $ref: ./consultation/paths.yaml#/Team
  /teams/{teamId}/logo:
    $ref: ./consultation/paths.yaml#/TeamLogo
  /divisions/{divisionId}/logo:
    $ref: ./consultation/paths.yaml#/DivisionLogo
  /pools/{poolId}:
    $ref: ./consultation/paths.yaml#/Pool
  /pools/{poolId}/standings:
    $ref: ./consultation/paths.yaml#/Standings
  /pools/{poolId}/participants:
    $ref: ./consultation/paths.yaml#/Participants
  /matches:
    $ref: ./consultation/paths.yaml#/Matches
  /matches/{matchId}:
    $ref: ./consultation/paths.yaml#/Match
  /matches/{matchId}/documents/{documentKind}:
    $ref: ./consultation/paths.yaml#/Document
  /administration/collection-seasons:
    $ref: ./collection/paths.yaml#/Seasons
  /administration/collection-seasons/{seasonId}:
    $ref: ./collection/paths.yaml#/Season
  /administration/collection-seasons/{seasonId}/closure:
    $ref: ./collection/paths.yaml#/Closure
  /administration/collection-seasons/{seasonId}/source-launches:
    $ref: ./collection/paths.yaml#/Launch
  /administration/collection-seasons/{seasonId}/source-bindings:
    $ref: ./collection/paths.yaml#/Sources
  /administration/source-bindings/{sourceBindingId}:
    $ref: ./collection/paths.yaml#/Source
  /administration/source-bindings/{sourceBindingId}/candidate:
    $ref: ./collection/paths.yaml#/Candidate
  /administration/source-bindings/{sourceBindingId}/validations:
    $ref: ./collection/paths.yaml#/Validation
  /administration/source-bindings/{sourceBindingId}/season-confirmation:
    $ref: ./collection/paths.yaml#/Confirmation
  /administration/source-bindings/{sourceBindingId}/children:
    $ref: ./collection/paths.yaml#/Children
  /administration/collection-controls:
    $ref: ./collection/paths.yaml#/Controls
  /administration/collection-controls/{controlId}:
    $ref: ./collection/paths.yaml#/Control
  /administration/collection-controls/{controlId}/activity:
    $ref: ./collection/paths.yaml#/Activity
  /administration/collection-controls/{controlId}/requests:
    $ref: ./collection/paths.yaml#/Requests
  /administration/collection-controls/{controlId}/results:
    $ref: ./collection/paths.yaml#/Results
  /application-access:
    $ref: ./access/paths.yaml#/Public
  /administration/maintenance:
    $ref: ./access/paths.yaml#/Maintenance
  /administration/maintenance/activation:
    $ref: ./access/paths.yaml#/Activation
  /administration/application-versions:
    $ref: ./access/paths.yaml#/Versions
  /accounts:
    $ref: ./accounts/paths.yaml#/Collection
  /accounts/me:
    $ref: ./accounts/paths.yaml#/Current
  /accounts/{accountId}:
    $ref: ./accounts/paths.yaml#/Member
  /accounts/{accountId}/photo:
    $ref: ./accounts/paths.yaml#/Photo
  /administration/clubs/{clubId}/presentation:
    $ref: ./sporting/paths.yaml#/ClubPresentation
  /administration/teams/{teamId}/presentation:
    $ref: ./sporting/paths.yaml#/TeamPresentation
  /administration/pools/{poolId}/presentation:
    $ref: ./sporting/paths.yaml#/PoolPresentation
  /administration/packs/{packId}/classification:
    $ref: ./sporting/paths.yaml#/PackClassification
  /administration/pools/{poolId}/classification:
    $ref: ./sporting/paths.yaml#/PoolClassification
  /administration/clubs/{clubId}/contacts:
    $ref: ./sporting/paths.yaml#/ClubContacts
  /administration/divisions:
    $ref: ./sporting/paths.yaml#/Divisions
  /administration/divisions/{divisionId}:
    $ref: ./sporting/paths.yaml#/Division
  /administration/divisions/{divisionId}/presentation:
    $ref: ./sporting/paths.yaml#/DivisionPresentation
  /administration/divisions/{divisionId}/activity:
    $ref: ./sporting/paths.yaml#/DivisionActivity
components:
  securitySchemes:
    MobileToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Bearer token issued to an allowed mobile client for this environment. The backend validates
        issuer, audience, expiry and client identity, then checks current global action grants and resource
        conditions. Ordinary membership, moderation or collector credentials grant no implicit
        administrative permission.
