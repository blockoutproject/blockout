openapi: 3.0.4
info:
  title: Blockout mobile API
  version: 0.1.0
  description:
    Backend API for application access, account lifecycle, public sporting consultation, discovery,
    personal following, notifications, private support and administration.
servers:
  - url: /
    description: Same-origin backend; deployment supplies its environment URL.
tags:
  - name: Support
    description: Private problems and suggestions from guests or signed-in people.
  - name: CollectionSources
    description: Candidate preparation, qualification evidence and qualified source launch.
  - name: Collection
    description: Collection controls and current operational evidence.
  - name: ApplicationAccess
    description: Public admission settings and separately authorized maintenance/version management.
  - name: Accounts
    description: Private account establishment, profile changes and erasure.
  - name: Sporting
    description: Sporting identities, presentation, classification and authorized corrections.
  - name: SportingClassification
    description: Atomic pack and pool acquisition classification corrections.
  - name: DivisionAdministration
    description: Configured divisions, creation and explicit activity commands.
  - name: Following
    description: Personal team/pool follows, public counts and personal match selection.
  - name: StreamContributions
    description: Owned stream links, exact-version reports and authorized video moderation.
  - name: Notifications
    description: Private inbox, read state, unread totals and current push associations.
security:
  - MobileToken: []
paths:
  /support-requests:
    $ref: ./support/paths.yaml#/Collection
  /accounts/{accountId}/notifications:
    $ref: ./notifications/paths.yaml#/Collection
  /accounts/{accountId}/notifications/{notificationId}:
    $ref: ./notifications/paths.yaml#/Member
  /accounts/{accountId}/notification-summary:
