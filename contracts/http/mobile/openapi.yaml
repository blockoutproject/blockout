openapi: 3.0.4
info:
  title: Blockout mobile API
  version: 0.1.0
  description:
    Canonical backend/mobile boundary. Authored operations cover F02 authorized administration.
    The F13 GET /health operation and other owners’ operations remain to be authored in this shared root;
    a feature plan never owns an editable API copy.
servers:
  - url: /
    description: Same-origin backend; deployment supplies its environment URL.
tags:
  - name: Sporting
    description: F02 sporting identities, observations and authorized corrections.
security:
  - MobileToken: []
paths:
  /administration/clubs/{clubId}/presentation:
    get:
      operationId: getClubPresentation
      tags:
        - Sporting
      summary: Read club presentation
      description:
        The backend requires the current F12 sporting-presentation grant for this resource.
        No ordinary member, moderator or collector inheritance. A stale revision returns 409 with no effects;
        after an uncertain response, GET current state before explicit retry. Return current effective
        and manual values.
      responses:
        "200":
          description: Accepted current projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportingPresentationResponse"
        "401":
          $ref: ../common/problems.yaml#/responses/401
        "403":
          $ref: ../common/problems.yaml#/responses/403
        "404":
          $ref: ../common/problems.yaml#/responses/404
        "503":
          $ref: ../common/problems.yaml#/responses/503
      parameters:
        - name: clubId
          in: path
          required: true
          description: Stable club identity, including retained resources within the operator grant.
          schema:
            type: string
            description: Stable club identity, including retained resources within the operator grant.
            format: uuid
    put:
      operationId: setClubPresentation
      tags:
        - Sporting
      summary: Set club names and logo
      description: >-
        Requires the current F12 sporting-presentation grant for this resource. No ordinary member, moderator or collector inheritance. A stale revision returns 409 without effects; after an uncertain response, GET current state before explicit retry. Metadata and optional image commit together. replace requires a decodable PNG/JPEG image of at most 5242880 bytes; keep and automatic forbid an image. Changes the manual club display name and logo; source names, contacts and identity remain unchanged. automatic clears the manual club logo and uses ordinary missing artwork.
      responses:
        "200":
          description: Accepted current projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportingPresentationResponse"
        "400":
          $ref: ../common/problems.yaml#/responses/400
        "401":
          $ref: ../common/problems.yaml#/responses/401
        "403":
          $ref: ../common/problems.yaml#/responses/403
        "404":
          $ref: ../common/problems.yaml#/responses/404
        "409":
          $ref: ../common/problems.yaml#/responses/409
        "422":
          $ref: ../common/problems.yaml#/responses/422
        "503":
          $ref: ../common/problems.yaml#/responses/503
        "413":
          $ref: ../common/problems.yaml#/responses/413
        "415":
          $ref: ../common/problems.yaml#/responses/415
      parameters:
        - name: clubId
          in: path
          required: true
          description: Stable club identity, including retained resources within the operator grant.
          schema:
            type: string
            description: Stable club identity, including retained resources within the operator grant.
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description:
                One ordinary multipart editor submission; metadata JSON plus an optional binary
                image.
              additionalProperties: false
              properties:
                metadata:
                  $ref: "#/components/schemas/SetClubPresentationRequest"
                image:
                  type: string
                  description:
                    Image part only with logoAction=replace; actual PNG/JPEG bytes, at most
                    5 MiB.
                  format: binary
              required:
                - metadata
            encoding:
              metadata:
                contentType: application/json
              image:
                contentType: image/png, image/jpeg
