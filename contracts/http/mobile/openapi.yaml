  /administration/divisions/{divisionId}/activity:
    put:
      operationId: setDivisionActivity
      tags:
        - Sporting
      summary: Change division activity
      description:
        Requires the F12 division-lifecycle grant. Deactivation hides dependent resources and
        suspends new acquisition under F01 rules. Reactivation lifts this reason only. Reread after uncertainty.
      responses:
        "200":
          description: Accepted current projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DivisionResponse"
        "400":
          $ref: ../common/problems.yaml#/responses/400
        "401":
          $ref: ../common/problems.yaml#/responses/401
        "403":
          $ref: ../common/problems.yaml#/responses/403
        "404":
          $ref: ../common/problems.yaml#/responses/404
        "409":
          $ref: ../common/problems.yaml#/responses/409
        "503":
          $ref: ../common/problems.yaml#/responses/503
      parameters:
        - name: divisionId
          in: path
          required: true
          description: Stable division identity.
          schema:
            type: string
            description: Stable division identity.
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDivisionActivityRequest"
components:
  securitySchemes:
    MobileToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description:
        F13 issuer, environment audience, expiry and allowed-client checks apply. Mobile client
        token; F12 current per-action and resource-scope grants are checked in the backend.
  schemas:
    SportingResourceKindEnum:
      type: string
      description: Resources with existing F02 identity editors.
      enum:
        - club
        - team
    ContactModeEnum:
      type: string
      description: Independent durable management mode for one field.
      enum:
        - source
        - manual
        - hidden
    SetClassificationRequest:
      type: object
      description:
        Desired pack default or complete pool override; null removes that setting. This is
        a scoped atomic correction, not a list of partial pool patches.
      additionalProperties: false
      properties:
        revision:
          type: string
          description: Current editing revision from the same resource GET.
          minLength: 1
        classification:
          type: object
          description:
            Null removes the default/override; restoring inheritance may leave acquisition
            unclassified while published facts retain their last classification.
          additionalProperties: false
          properties:
            divisionId:
              type: string
              description: Active division for a new assignment.
              format: uuid
            format:
              $ref: ../common/sporting-enums.yaml#/SportFormatEnum
            gender:
              $ref: ../common/sporting-enums.yaml#/SportGenderEnum
          required:
            - divisionId
            - format
            - gender
          nullable: true
      required:
        - revision
        - classification
    ClassificationDetailResponse:
      type: object
      description:
        A pack or pool editor projection. Current setting, effective acquisition classification
        and retained published classification are distinct.
      additionalProperties: true
      properties:
        id:
          type: string
          description: Pack or pool identity.
          format: uuid
        revision:
          type: string
          description: Opaque revision covering relevant state and inherited values.
        setting:
          type: object
          description: Own pack default or pool override; null means no own setting.
          additionalProperties: true
          properties:
            divisionId:
              type: string
              description: Division identity.
              format: uuid
            format:
              $ref: ../common/sporting-enums.yaml#/SportFormatEnum
            gender:
              $ref: ../common/sporting-enums.yaml#/SportGenderEnum
          required:
            - divisionId
            - format
            - gender
          nullable: true
        effective:
          type: object
          description:
            Current acquisition classification after inheritance; null means collection cannot
            start.
          additionalProperties: true
          properties:
            divisionId:
              type: string
              description: Division identity.
              format: uuid
            format:
              $ref: ../common/sporting-enums.yaml#/SportFormatEnum
            gender:
              $ref: ../common/sporting-enums.yaml#/SportGenderEnum
          required:
            - divisionId
            - format
            - gender
          nullable: true
      required:
        - id
        - revision
        - setting
        - effective
    NamePresentationResponse:
      type: object
      description:
        Names independent of identity. Effective values include eligible source and manual
        precedence.
      additionalProperties: true
      properties:
        sourceName:
          type: string
          description: Current attributable source label.
          nullable: true
        effectiveName:
          type: string
          description: Current display name.
        manualName:
          type: string
          description: Current full/display name customization; null selects automatic.
          nullable: true
        effectiveShortName:
          type: string
          description: Team/pool short name if available; omitted for a club.
        manualShortName:
          type: string
          description:
            Independent team/pool short customization; null selects automatic; omitted for
            a club.
          nullable: true
      required:
        - sourceName
        - effectiveName
        - manualName
    LogoPresentationResponse:
      type: object
      description:
        Effective artwork projection. URLs designate backend-controlled image delivery subject
        to current access rules; provider URLs are not public proxies.
      additionalProperties: true
      properties:
        effectiveUrl:
          type: string
          description: Resolved valid image URL; null represents the ordinary missing-artwork state.
          format: uri
          nullable: true
        manualUrl:
          type: string
          description: Current manual image, if any.
          format: uri
          nullable: true
        automaticUrl:
          type: string
          description: Current eligible LNV/club fallback independent of a manual image; null when unavailable.
          format: uri
          nullable: true
      required:
        - effectiveUrl
        - manualUrl
        - automaticUrl
    SportingPresentationResponse:
      type: object
      description:
        Existing resource editor projection. A professional team has no compulsory club relation;
        no editing operation sets that relation.
      additionalProperties: true
      properties:
        id:
          type: string
          description: Stable resource identity.
          format: uuid
        kind:
          $ref: "#/components/schemas/SportingResourceKindEnum"
        revision:
          type: string
          description:
            Opaque current editing revision, changed by relevant state changes, not freshness-only
            refreshes.
        names:
          $ref: "#/components/schemas/NamePresentationResponse"
        logo:
          $ref: "#/components/schemas/LogoPresentationResponse"
      required:
        - id
        - kind
        - revision
        - names
        - logo
    SetClubPresentationRequest:
      type: object
      description: Set the manual club display name and logo action; source values, contacts and identity remain unchanged.
      additionalProperties: false
      properties:
        revision:
          type: string
          description: Current editing revision.
          minLength: 1
        manualName:
          type: string
          description:
            Null restores the current automatic name. Empty string is invalid; whitespace-only
