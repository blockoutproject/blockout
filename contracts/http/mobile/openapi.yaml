      parameters:
        - name: teamId
          in: path
          required: true
          description: Stable team identity, including retained resources within the operator grant.
          schema:
            type: string
            description: Stable team identity, including retained resources within the operator grant.
            format: uuid
    put:
      operationId: setTeamPresentation
      tags:
        - Sporting
      summary: Set team names and logo
      description: >-
        Requires the current F12 sporting-presentation grant for this resource. No ordinary member, moderator or collector inheritance. A stale revision returns 409 without effects; after an uncertain response, GET current state before explicit retry. Metadata and optional image commit together. replace requires a decodable PNG/JPEG image of at most 5242880 bytes; keep and automatic forbid an image. Changes independent full/short names and the manual team logo without changing source values or identity. automatic resolves LNV then the optional club for professional teams, or the club for other teams, then ordinary missing artwork.
      responses:
        "200":
          description: Accepted current projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SportingPresentationResponse"
        "400":
          $ref: ../common/problems.yaml#/responses/400
        "401":
          $ref: ../common/problems.yaml#/responses/401
        "403":
          $ref: ../common/problems.yaml#/responses/403
        "404":
          $ref: ../common/problems.yaml#/responses/404
        "409":
          $ref: ../common/problems.yaml#/responses/409
        "422":
          $ref: ../common/problems.yaml#/responses/422
        "503":
          $ref: ../common/problems.yaml#/responses/503
        "413":
          $ref: ../common/problems.yaml#/responses/413
        "415":
          $ref: ../common/problems.yaml#/responses/415
      parameters:
        - name: teamId
          in: path
          required: true
          description: Stable team identity, including retained resources within the operator grant.
          schema:
            type: string
            description: Stable team identity, including retained resources within the operator grant.
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description:
                One ordinary multipart editor submission; metadata JSON plus an optional binary
                image.
              additionalProperties: false
              properties:
                metadata:
                  $ref: "#/components/schemas/SetTeamPresentationRequest"
                image:
                  type: string
