        "409":
          $ref: ../common/problems.yaml#/responses/Conflict
        "422":
          $ref: ../common/problems.yaml#/responses/UnprocessableContent
        "503":
          $ref: ../common/problems.yaml#/responses/ServiceUnavailable
      parameters:
        - name: poolId
          in: path
          required: true
          description: Authorized pool identity.
          schema:
            type: string
            description: Authorized pool identity.
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetClassificationRequest"
  /administration/clubs/{clubId}/contacts:
    get:
      operationId: getClubContacts
      tags:
        - Sporting
      summary: Read editable club contacts
      description: >-
        Returns current contact values, independent management modes and the editing revision.
        Requires global sporting-presentation permission for contact correction. Current privacy restrictions apply to
        every returned value.
      responses:
        "400":
          $ref: ../common/problems.yaml#/responses/BadRequest
        "200":
          description: >-
            Current authorized values.
          headers:
            Cache-Control:
              $ref: ../common/headers.yaml#/NoStore
            Accept-Patch:
              $ref: ../common/headers.yaml#/AcceptPatchJson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubContactsResponse"
        "401":
          $ref: ../common/problems.yaml#/responses/Unauthorized
        "403":
          $ref: ../common/problems.yaml#/responses/Forbidden
        "404":
          $ref: ../common/problems.yaml#/responses/NotFound
        "503":
          $ref: ../common/problems.yaml#/responses/ServiceUnavailable
      parameters:
        - name: clubId
          in: path
          required: true
          description: Stable club identity for contact correction.
          schema:
            type: string
            description: Stable club identity for contact correction.
            format: uuid
    patch:
      operationId: setClubContacts
      tags:
        - Sporting
      summary: Correct selected club contact fields
      description: >-
        Requires global sporting-presentation permission for contact correction. Applies supplied field modes atomically
        against the current revision; omitted fields are unchanged. A change to the effective
        municipality or postal context clears the old point and advances the locality revision. A
        stale revision or a write conflicting with a contact privacy restriction returns 409 without
        changes. Ordinary edits cannot lift a privacy restriction. After an uncertain response, read
        current state before an explicit retry; do not replay automatically.
      responses:
        "415":
          $ref: ../common/problems.yaml#/responses/UnsupportedMediaType
        "200":
          description: >-
            Updated values after the complete change is accepted.
          headers:
            Cache-Control:
              $ref: ../common/headers.yaml#/NoStore
            Accept-Patch:
              $ref: ../common/headers.yaml#/AcceptPatchJson
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubContactsResponse"
        "400":
          $ref: ../common/problems.yaml#/responses/BadRequest
        "401":
          $ref: ../common/problems.yaml#/responses/Unauthorized
        "403":
          $ref: ../common/problems.yaml#/responses/Forbidden
        "404":
          $ref: ../common/problems.yaml#/responses/NotFound
        "409":
          $ref: ../common/problems.yaml#/responses/Conflict
        "422":
          $ref: ../common/problems.yaml#/responses/UnprocessableContent
        "503":
          $ref: ../common/problems.yaml#/responses/ServiceUnavailable
      parameters:
        - name: clubId
          in: path
          required: true
          description: Stable club identity for contact correction.
          schema:
            type: string
            description: Stable club identity for contact correction.
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetClubContactsRequest"
  /administration/divisions:
    get:
      operationId: listDivisions
      tags:
        - Sporting
      summary: List configured divisions
      description: >-
        Returns configured divisions ordered by case-folded name, then UUID. Inactive divisions are
        included only when requested. Requires division-management or sporting-classification
        permission.
      responses:
        "400":
          $ref: ../common/problems.yaml#/responses/BadRequest
        "200":
          description: >-
            Configured divisions matching the requested activity filter.
          headers:
            Cache-Control:
              $ref: ../common/headers.yaml#/NoStore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DivisionListResponse"
        "401":
          $ref: ../common/problems.yaml#/responses/Unauthorized
        "403":
          $ref: ../common/problems.yaml#/responses/Forbidden
        "503":
          $ref: ../common/problems.yaml#/responses/ServiceUnavailable
      parameters:
        - name: includeInactive
          in: query
          required: false
          description: Include inactive divisions for lifecycle management.
          schema:
            type: boolean
            default: false
    post:
      operationId: createDivision
      tags:
        - Sporting
      summary: Create a sporting division
      description: >-
        Requires division-management permission. Creates an active division with a case-insensitively
        unique name, colors and optional logo in one atomic save. replace requires a decodable
        PNG/JPEG image of at most 5242880 bytes; keep and automatic forbid an image and create the
        division without a logo. After an uncertain response, read the division list before an
        explicit retry.
      responses:
        "201":
          description: >-
            Created active division.
          headers:
            Cache-Control:
              $ref: ../common/headers.yaml#/NoStore
            Location:
              description: URI of the created division, returned on every successful creation.
              schema:
                type: string
                format: uri-reference
                example: /administration/divisions/7e747352-4b76-4676-bd17-a694c7c4fd88
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DivisionResponse"
        "400":
          $ref: ../common/problems.yaml#/responses/BadRequest
        "401":
          $ref: ../common/problems.yaml#/responses/Unauthorized
        "403":
          $ref: ../common/problems.yaml#/responses/Forbidden
        "409":
          $ref: ../common/problems.yaml#/responses/Conflict
        "422":
          $ref: ../common/problems.yaml#/responses/UnprocessableContent
        "503":
          $ref: ../common/problems.yaml#/responses/ServiceUnavailable
        "413":
          $ref: ../common/problems.yaml#/responses/ContentTooLarge
        "415":
          $ref: ../common/problems.yaml#/responses/UnsupportedMediaType
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description:
                One ordinary multipart editor submission; metadata JSON plus an optional binary
                image.
              additionalProperties: false
              properties:
                metadata:
                  $ref: "#/components/schemas/CreateDivisionRequest"
                image:
                  type: string
                  description:
                    Image part only with logoAction=replace; actual PNG/JPEG bytes, at most
                    5 MiB.
                  format: binary
              required:
                - metadata
            encoding:
              metadata:
                contentType: application/json
              image:
                contentType: image/png, image/jpeg
  /administration/divisions/{divisionId}:
    get:
      operationId: getDivision
      tags:
        - Sporting
      summary: Read a division
      description: >-
        Returns the division’s presentation, activity and current editing revision. Requires
        division-management or sporting-classification permission.
      responses:
        "400":
          $ref: ../common/problems.yaml#/responses/BadRequest
        "200":
          description: >-
            Current authorized values.
          headers:
            Cache-Control:
              $ref: ../common/headers.yaml#/NoStore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DivisionResponse"
        "401":
          $ref: ../common/problems.yaml#/responses/Unauthorized
        "403":
          $ref: ../common/problems.yaml#/responses/Forbidden
        "404":
          $ref: ../common/problems.yaml#/responses/NotFound
        "503":
          $ref: ../common/problems.yaml#/responses/ServiceUnavailable
      parameters:
        - name: divisionId
          in: path
          required: true
          description: Stable division identity.
          schema:
            type: string
            description: Stable division identity.
            format: uuid
  /administration/divisions/{divisionId}/presentation:
    patch:
      operationId: setDivisionPresentation
      tags:
        - Sporting
      summary: Edit division presentation
      description: >-
        Requires division-management permission. Saves the name, colors and logo action together
        without changing identity or activity. Case-insensitive name uniqueness applies. replace
        requires a decodable PNG/JPEG image of at most 5242880 bytes; keep and automatic forbid an
        image. automatic removes the manual logo without a team or club fallback. A stale revision
        returns 409 without changes. After an uncertain response, read current state before an
        explicit retry.
      responses:
        "200":
          description: >-
            Updated values after the complete change is accepted.
          headers:
            Cache-Control:
              $ref: ../common/headers.yaml#/NoStore
            Accept-Patch:
              $ref: ../common/headers.yaml#/AcceptPatchMultipart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DivisionResponse"
        "400":
          $ref: ../common/problems.yaml#/responses/BadRequest
        "401":
          $ref: ../common/problems.yaml#/responses/Unauthorized
        "403":
          $ref: ../common/problems.yaml#/responses/Forbidden
        "404":
          $ref: ../common/problems.yaml#/responses/NotFound
        "409":
          $ref: ../common/problems.yaml#/responses/Conflict
        "422":
          $ref: ../common/problems.yaml#/responses/UnprocessableContent
        "503":
          $ref: ../common/problems.yaml#/responses/ServiceUnavailable
        "413":
          $ref: ../common/problems.yaml#/responses/ContentTooLarge
        "415":
          $ref: ../common/problems.yaml#/responses/UnsupportedMediaType
      parameters:
        - name: divisionId
          in: path
          required: true
          description: Stable division identity.
          schema:
            type: string
            description: Stable division identity.
            format: uuid
      requestBody:
        description: >-
          Atomic presentation changes encoded as JSON metadata and an optional image. All metadata
          fields remain required; logoAction=keep preserves only the existing logo. This is not a
          JSON Merge Patch or JSON Patch document.
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              description:
                One ordinary multipart editor submission; metadata JSON plus an optional binary
                image.
              additionalProperties: false
              properties:
                metadata:
                  $ref: "#/components/schemas/SetDivisionPresentationRequest"
                image:
                  type: string
                  description:
                    Image part only with logoAction=replace; actual PNG/JPEG bytes, at most
                    5 MiB.
                  format: binary
              required:
                - metadata
            encoding:
              metadata:
                contentType: application/json
              image:
                contentType: image/png, image/jpeg
  /administration/divisions/{divisionId}/activity:
    put:
      operationId: setDivisionActivity
      tags:
        - Sporting
      summary: Change division activity
      description: >-
        Requires division-lifecycle permission and the current editing revision. Deactivation hides
        dependent sporting resources and prevents collection from the next acquisition cycle; clubs
        remain visible and already-running cycles may finish. Reactivation lifts only the inactivity
        restriction. A stale revision returns 409 without changes. After an uncertain response, read
        current state before an explicit retry.
      responses:
        "415":
          $ref: ../common/problems.yaml#/responses/UnsupportedMediaType
        "200":
          description: >-
            Updated values after the complete change is accepted.
          headers:
            Cache-Control:
              $ref: ../common/headers.yaml#/NoStore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DivisionResponse"
        "400":
          $ref: ../common/problems.yaml#/responses/BadRequest
        "401":
          $ref: ../common/problems.yaml#/responses/Unauthorized
        "403":
          $ref: ../common/problems.yaml#/responses/Forbidden
        "404":
          $ref: ../common/problems.yaml#/responses/NotFound
        "409":
          $ref: ../common/problems.yaml#/responses/Conflict
        "503":
          $ref: ../common/problems.yaml#/responses/ServiceUnavailable
      parameters:
        - name: divisionId
          in: path
          required: true
          description: Stable division identity.
          schema:
            type: string
            description: Stable division identity.
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDivisionActivityRequest"
components:
  securitySchemes:
    MobileToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Bearer token issued to an allowed mobile client for this environment. The backend validates
        issuer, audience, expiry and client identity, then checks current global action grants and resource
        conditions. Ordinary membership, moderation or collector credentials grant no implicit
        administrative permission.
  schemas:
    SportingResourceKindEnum:
      type: string
      description: >-
        Club and team resources with presentation editors.
      enum:
        - club
        - team
    ContactModeEnum:
      type: string
      description: Independent durable management mode for one field.
      enum:
        - source
        - manual
        - hidden
    SetClassificationRequest:
      type: object
      description:
        Desired pack default or complete pool override; null removes that setting. This is
        a scoped atomic correction, not a list of partial pool patches.
      additionalProperties: false
      properties:
        revision:
          type: string
          description: Current editing revision from the same resource GET.
          minLength: 1
        classification:
          type: object
          description: >-
            Null removes this pack default or pool override. A pool then inherits its pack default, if
            any. Missing acquisition classification does not erase the classification of published
            data.
          additionalProperties: false
          properties:
            divisionId:
              type: string
              description: Active division for a new assignment.
              format: uuid
            format:
              $ref: ../common/sporting-enums.yaml#/SportFormatEnum
            gender:
              $ref: ../common/sporting-enums.yaml#/SportGenderEnum
          required:
            - divisionId
            - format
            - gender
          nullable: true
      required:
        - revision
        - classification
    ClassificationDetailResponse:
      type: object
      description: >-
        Current pack or pool setting, effective acquisition classification and editing revision. The
        effective value governs collection; it does not describe the retained classification of
        already published sporting data.
      additionalProperties: true
      properties:
        id:
          type: string
          description: Pack or pool identity.
          format: uuid
        revision:
          type: string
          description: Opaque revision covering relevant state and inherited values.
        setting:
          type: object
          description: Own pack default or pool override; null means no own setting.
          additionalProperties: true
          properties:
            divisionId:
              type: string
              description: Division identity.
              format: uuid
            format:
              $ref: ../common/sporting-enums.yaml#/SportFormatEnum
            gender:
              $ref: ../common/sporting-enums.yaml#/SportGenderEnum
          required:
            - divisionId
            - format
            - gender
          nullable: true
        effective:
          type: object
          description:
            Current acquisition classification after inheritance; null means collection cannot
            start.
          additionalProperties: true
          properties:
            divisionId:
              type: string
              description: Division identity.
              format: uuid
            format:
              $ref: ../common/sporting-enums.yaml#/SportFormatEnum
            gender:
              $ref: ../common/sporting-enums.yaml#/SportGenderEnum
          required:
            - divisionId
            - format
            - gender
          nullable: true
      required:
        - id
        - revision
        - setting
        - effective
    NamePresentationResponse:
      type: object
      description:
        Names independent of identity. Effective values include eligible source and manual
        precedence.
      additionalProperties: true
      properties:
        sourceName:
          type: string
          description: Current attributable source label.
          nullable: true
        effectiveName:
          type: string
          description: Current display name.
        manualName:
          type: string
          description: Current full/display name customization; null selects automatic.
          nullable: true
        effectiveShortName:
          type: string
          description: Team/pool short name if available; omitted for a club.
        manualShortName:
          type: string
          description:
            Independent team/pool short customization; null selects automatic; omitted for
            a club.
          nullable: true
      required:
        - sourceName
        - effectiveName
        - manualName
    LogoPresentationResponse:
      type: object
      description:
        Effective artwork projection. URLs designate backend-controlled image delivery subject
        to current access rules; provider URLs are not public proxies.
      additionalProperties: true
      properties:
        effectiveUrl:
          type: string
          description: Resolved valid image URL; null represents the ordinary missing-artwork state.
          format: uri
          nullable: true
        manualUrl:
          type: string
          description: Current manual image, if any.
          format: uri
          nullable: true
        automaticUrl:
          type: string
          description: >-
            Current team fallback, independent of manual artwork: LNV then the associated club for
            professionals, or the club for other teams. Null for a club, a division or when no fallback is
            available.
          format: uri
          nullable: true
      required:
        - effectiveUrl
        - manualUrl
        - automaticUrl
    SportingPresentationResponse:
      type: object
      description: >-
        Club or team names, effective and manual logo values, and editing revision. Team club
        associations are not editable through this projection.
      additionalProperties: true
      properties:
        id:
          type: string
          description: Stable resource identity.
          format: uuid
        kind:
          $ref: "#/components/schemas/SportingResourceKindEnum"
        revision:
          type: string
          description:
            Opaque current editing revision, changed by relevant state changes, not freshness-only
            refreshes.
        names:
          $ref: "#/components/schemas/NamePresentationResponse"
        logo:
          $ref: "#/components/schemas/LogoPresentationResponse"
      required:
        - id
        - kind
        - revision
        - names
        - logo
    SetClubPresentationRequest:
      type: object
      description: Set the manual club display name and logo action; source values, contacts and identity remain unchanged.
      additionalProperties: false
      properties:
        revision:
          type: string
          description: Current editing revision.
          minLength: 1
        manualName:
          type: string
          description:
            Null restores the current automatic name. Empty string is invalid; whitespace-only
            input is rejected.
          nullable: true
          minLength: 1
        logoAction:
          $ref: "#/components/schemas/LogoActionEnum"
      required:
        - revision
        - manualName
        - logoAction
    SetTeamPresentationRequest:
      type: object
      description:
        Set independent team name customizations and the manual logo action. Clearing one field
        never implicitly clears another.
      additionalProperties: false
      properties:
        revision:
          type: string
          description: Current editing revision.
          minLength: 1
        manualName:
          type: string
          description: Null restores current automatic full name; empty/whitespace-only is invalid.
          nullable: true
          minLength: 1
        manualShortName:
          type: string
          description: Null restores current automatic short name; empty/whitespace-only is invalid.
          nullable: true
          minLength: 1
        logoAction:
          $ref: "#/components/schemas/LogoActionEnum"
      required:
        - revision
        - manualName
        - manualShortName
        - logoAction
    SetPoolPresentationRequest:
      type: object
      description: Set independent pool full/short name customizations; no image or logo action.
      additionalProperties: false
      properties:
        revision:
          type: string
          description: Current editing revision.
          minLength: 1
        manualName:
          type: string
          description: Null restores current automatic full name; empty/whitespace-only is invalid.
          nullable: true
          minLength: 1
        manualShortName:
          type: string
          description: Null restores current automatic short name; empty/whitespace-only is invalid.
          nullable: true
          minLength: 1
      required:
        - revision
        - manualName
        - manualShortName
    PoolPresentationResponse:
      type: object
      description: Current pool name presentation and editing revision.
      additionalProperties: true
      properties:
        id:
          type: string
          description: Stable resource identity.
          format: uuid
        revision:
          type: string
          description:
            Opaque current editing revision, changed by relevant state changes, not freshness-only
            refreshes.
        names:
          $ref: "#/components/schemas/NamePresentationResponse"
      required:
        - id
        - revision
        - names
    ContactFieldRequest:
      type: object
      description:
        One desired contact mode. value is required and nonempty only for manual; forbidden
        for source or hidden. No history of former values.
      additionalProperties: false
      properties:
        mode:
          $ref: "#/components/schemas/ContactModeEnum"
        value:
          type: string
          description: Manual value validated for this field and current privacy rules.
          minLength: 1
      required:
        - mode
    ContactFieldResponse:
      type: object
      description:
        Authorized current value and management mode. Privacy-restricted values remain null
        even in manual mode.
      additionalProperties: true
      properties:
        mode:
          $ref: "#/components/schemas/ContactModeEnum"
        effectiveValue:
          type: string
          description: Currently permitted value; null means absent.
          nullable: true
        sourceValue:
          type: string
          description: Currently eligible source value; null means absent/restricted.
          nullable: true
        manualValue:
          type: string
          description: Currently eligible manual value; null outside manual mode or when restricted.
          nullable: true
      required:
        - mode
        - effectiveValue
        - sourceValue
        - manualValue
    SetClubContactsRequest:
      type: object
      description:
        Set desired state only for supplied fields. Omitted fields are unchanged. At least
        one field is required alongside revision. This application/json change document replaces
        each supplied field mode atomically; it is not JSON Merge Patch or JSON Patch. Null field
        objects are invalid; use source or hidden mode instead.
      additionalProperties: false
      properties:
        revision:
          type: string
          description: Current club contacts editing revision.
          minLength: 1
        address:
          $ref: "#/components/schemas/ContactFieldRequest"
        city:
          $ref: "#/components/schemas/ContactFieldRequest"
        postalCode:
          $ref: "#/components/schemas/ContactFieldRequest"
        email:
          $ref: "#/components/schemas/ContactFieldRequest"
        phone:
          $ref: "#/components/schemas/ContactFieldRequest"
        website:
          $ref: "#/components/schemas/ContactFieldRequest"
      required:
        - revision
    ClubContactsResponse:
      type: object
      description: Current independently managed club contacts; no personal data in error details or diagnostics.
      additionalProperties: true
      properties:
        clubId:
          type: string
          description: Stable club identity.
          format: uuid
        revision:
          type: string
          description: Opaque contact editing revision.
        address:
          $ref: "#/components/schemas/ContactFieldResponse"
        city:
          $ref: "#/components/schemas/ContactFieldResponse"
        postalCode:
          $ref: "#/components/schemas/ContactFieldResponse"
        email:
          $ref: "#/components/schemas/ContactFieldResponse"
        phone:
          $ref: "#/components/schemas/ContactFieldResponse"
        website:
          $ref: "#/components/schemas/ContactFieldResponse"
      required:
        - clubId
        - revision
        - address
        - city
        - postalCode
        - email
        - phone
        - website
    CreateDivisionRequest:
      type: object
      description: >-
        Name, colors and logo action used when creating an active division.
      additionalProperties: false
      properties:
        name:
          type: string
          description: Nonempty display name, unique ignoring case.
          minLength: 1
        color:
          type: string
          description: sRGB hexadecimal color.
          pattern: ^#[0-9A-Fa-f]{6}$
          example: "#F0AA00"
        gradient:
          type: array
          description: Three explicit gradient colors, or null to use the ordinary color-derived treatment.
          items:
            type: string
            description: sRGB hexadecimal color.
            pattern: ^#[0-9A-Fa-f]{6}$
            example: "#F0AA00"
          minItems: 3
          maxItems: 3
          nullable: true
        logoAction:
          $ref: "#/components/schemas/LogoActionEnum"
      required:
        - name
        - color
        - gradient
        - logoAction
    SetDivisionPresentationRequest:
      type: object
      description: >-
        Division name, colors and logo action with the current editing revision; activity remains
        unchanged.
      additionalProperties: false
      properties:
        revision:
          type: string
          description: Current division editing revision.
          minLength: 1
        name:
          type: string
          description: Nonempty display name, unique ignoring case.
          minLength: 1
        color:
          type: string
          description: sRGB hexadecimal color.
          pattern: ^#[0-9A-Fa-f]{6}$
          example: "#F0AA00"
        gradient:
          type: array
          description: Three explicit gradient colors, or null to use the ordinary color-derived treatment.
          items:
            type: string
            description: sRGB hexadecimal color.
            pattern: ^#[0-9A-Fa-f]{6}$
            example: "#F0AA00"
          minItems: 3
          maxItems: 3
          nullable: true
        logoAction:
          $ref: "#/components/schemas/LogoActionEnum"
      required:
        - revision
        - name
        - color
        - gradient
        - logoAction
    DivisionResponse:
      type: object
      description: Division identity, presentation and independent lifecycle.
      additionalProperties: true
      properties:
        id:
          type: string
          description: Stable division identity.
          format: uuid
        revision:
          type: string
          description: Current editing revision.
        name:
          type: string
          description: Nonempty display name, unique ignoring case.
          minLength: 1
        color:
          type: string
          description: sRGB hexadecimal color.
          pattern: ^#[0-9A-Fa-f]{6}$
          example: "#F0AA00"
        gradient:
          type: array
          description: Three explicit gradient colors, or null to use the ordinary color-derived treatment.
          items:
            type: string
            description: sRGB hexadecimal color.
            pattern: ^#[0-9A-Fa-f]{6}$
            example: "#F0AA00"
          minItems: 3
          maxItems: 3
          nullable: true
        logo:
          $ref: "#/components/schemas/LogoPresentationResponse"
        active:
          type: boolean
          description: Explicit lifecycle state; presentation writes never change it.
      required:
        - id
        - revision
        - name
        - color
        - gradient
        - logo
        - active
    DivisionListResponse:
      type: object
      description:
        Administrative selection list; all matching configured divisions, ordered by case-folded
        name then UUID. No pagination is needed for this configuration list.
      additionalProperties: true
      properties:
        items:
          type: array
          description: Divisions matching includeInactive.
          items:
            $ref: "#/components/schemas/DivisionResponse"
      required:
        - items
    SetDivisionActivityRequest:
      type: object
      description: Explicit lifecycle command separate from presentation. Never deletes sporting history.
      additionalProperties: false
      properties:
        revision:
          type: string
          description: Current division revision.
          minLength: 1
        active:
          type: boolean
          description:
            Desired activity; lifting inactivity leaves independent hiding/eligibility reasons
            intact.
      required:
        - revision
        - active
    LogoActionEnum:
      type: string
      description: Desired logo behavior within the single editor save.
      enum:
        - keep
        - replace
        - automatic
