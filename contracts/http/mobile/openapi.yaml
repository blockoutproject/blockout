          schema:
            type: string
            description: Authorized pack identity.
            format: uuid
    put:
      operationId: setPackClassification
      tags:
        - Sporting
      summary: Set pack classification
      description:
        Requires the F12 sporting-classification grant over the full affected scope. Shared
        participation or target-identity conflicts refuse the entire command. No automatic split, merge
        or partial correction. Removal restores pack inheritance for a pool. With no effective setting,
        collection stops but accepted published classification remains. Use the current revision and reread
        after uncertainty.
      responses:
        "200":
          description: Accepted current projection.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassificationDetailResponse"
        "400":
          $ref: ../common/problems.yaml#/responses/400
        "401":
          $ref: ../common/problems.yaml#/responses/401
        "403":
