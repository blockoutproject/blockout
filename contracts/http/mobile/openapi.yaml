    DivisionPresentationRequest:
      type: object
      description: Division presentation only; never changes lifecycle.
      additionalProperties: false
      properties:
        name:
          type: string
          description: Nonempty display name, unique ignoring case.
          minLength: 1
        color:
          type: string
          description: sRGB hexadecimal color.
          pattern: ^#[0-9A-Fa-f]{6}$
          example: "#F0AA00"
        gradient:
          type: array
          description: Three explicit gradient colors, or null to use the ordinary color-derived treatment.
          items:
            type: string
            description: sRGB hexadecimal color.
            pattern: ^#[0-9A-Fa-f]{6}$
            example: "#F0AA00"
          minItems: 3
          maxItems: 3
          nullable: true
        logoAction:
          $ref: "#/components/schemas/LogoActionEnum"
      required:
        - name
        - color
        - gradient
        - logoAction
    SetDivisionPresentationRequest:
      type: object
