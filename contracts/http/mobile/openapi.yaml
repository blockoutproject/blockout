components:
  securitySchemes:
    MobileToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description:
        Bearer token issued to an allowed mobile client for this environment. The backend validates
        issuer, audience, expiry and client identity, then checks current global action grants and resource
        conditions. Ordinary membership, moderation or collector credentials grant no implicit administrative
        permission.
