          in: path
          required: true
          description: Authorized pool identity.
          schema:
            type: string
            description: Authorized pool identity.
            format: uuid
    put:
      operationId: setPoolClassification
      tags:
        - Sporting
      summary: Set pool classification
      description: >-
        Requires global sporting-classification permission; all affected resources remain subject to their business rules. Sets or removes the
        complete pool override atomically. Removing the pool override restores its pack default, if
        available. Without an effective classification, collection stops while accepted published
        classification remains. A stale revision, conflicting shared participation or target-identity
        collision refuses the entire change without splitting or merging teams. After an uncertain
        response, read current state before an explicit retry.
      responses:
        "415":
          $ref: ../common/problems.yaml#/responses/UnsupportedMediaType
        "200":
