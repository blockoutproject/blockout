        schema:
          type: string
          description: Stable resource identity.
          format: uuid
  post:
    operationId: createCollectionSource
    tags:
      - CollectionSources
    summary: Add a source candidate (retired)
    deprecated: true
    description:
      Requires current global collection-management permission. Current servers refuse this
      retired operation with 409. Official sources are discovered automatically.
    responses:
      "201":
        description: Legacy success response from earlier servers.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
          Location:
            description: URI of the created resource.
            schema:
              type: string
              description: Created resource URI.
              format: uri-reference
              example: /administration/source-bindings/00000000-0000-4000-8000-000000000001
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/SourceBindingResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
