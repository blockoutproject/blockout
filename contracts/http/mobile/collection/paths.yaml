Seasons:
  get:
    operationId: listCollectionSeasons
    tags:
      - CollectionSources
    summary: Read known collection seasons
    description:
      Requires current global collection-management permission. Includes preparation, active
      collection and closed history.
    responses:
      "200":
        description: Known seasons in display order.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/CollectionSeasonListResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
Season:
  get:
    operationId: getCollectionSeason
    tags:
      - CollectionSources
    summary: Read a collection season
    description:
      Requires current global collection-management permission. Returns current lifecycle and
      preparation state.
    responses:
      "200":
        description: Current season lifecycle and preparation state.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/CollectionSeasonResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
    parameters:
      - name: seasonId
        in: path
        required: true
        description: Stable resource identity.
        schema:
          type: string
          description: Stable resource identity.
          format: uuid
Closure:
  post:
    operationId: closeCollectionSeason
    tags:
      - Collection
    summary: Close a season definitively
    description:
      Requires current global collection-management permission. Requires the exact displayed label.
      Cancels unstarted work; already-running cycles may finish once. Other seasons and club
      controls are unchanged. No reopening. A failed or
      lost response permits explicit manual retry without a verification read.
    responses:
      "200":
        description: Season closed; already admitted work may finish.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/CollectionSeasonResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "409":
        $ref: ../../common/problems.yaml#/responses/Conflict
      "413":
        $ref: ../../common/problems.yaml#/responses/ContentTooLarge
      "415":
        $ref: ../../common/problems.yaml#/responses/UnsupportedMediaType
      "422":
        $ref: ../../common/problems.yaml#/responses/UnprocessableContent
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
    parameters:
      - name: seasonId
        in: path
        required: true
        description: Stable resource identity.
        schema:
          type: string
          description: Stable resource identity.
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/CloseCollectionSeasonRequest
Activation:
  post:
    operationId: activateCollectionSeason
    tags:
      - CollectionSources
    summary: Activate collection for a season
    description:
      Requires current global collection-management permission. Authorizes periodic sporting
      collection for eligible pools in the selected season. Catalogues continue refreshing
      independently. Preserves provider pauses and other seasons. Repeating activation of an
      active season returns its current state. Closure and an accepted historical request waiting
      for admission block activation.
    responses:
      "200":
        description: Active season.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/CollectionSeasonResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "409":
        $ref: ../../common/problems.yaml#/responses/Conflict
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
    parameters:
      - name: seasonId
        in: path
        required: true
        description: Canonical collection season to activate.
        schema:
          type: string
          description: Stable season identity.
          format: uuid
