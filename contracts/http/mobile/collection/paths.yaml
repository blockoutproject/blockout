        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
    parameters:
      - name: controlId
        in: path
        required: true
        description: Stable resource identity.
        schema:
          type: string
          description: Stable resource identity.
          format: uuid
Activity:
  put:
    operationId: setCollectionActivity
    tags:
      - Collection
    summary: Set collection activity
    description:
      Requires current global collection-management permission. Pause cancels pending unstarted
      collection and drains the current cycle. Resume restores ordinary eligibility without catch-up,
      source unlocking or request replay. Stale revisions return 409 without changes. Read current state
      after an uncertain result before an explicit retry.
    responses:
      "200":
        description: Current accepted state; no implicit success for work not yet performed.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/CollectionControlResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "409":
        $ref: ../../common/problems.yaml#/responses/Conflict
      "413":
        $ref: ../../common/problems.yaml#/responses/ContentTooLarge
      "415":
        $ref: ../../common/problems.yaml#/responses/UnsupportedMediaType
      "422":
        $ref: ../../common/problems.yaml#/responses/UnprocessableContent
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
    parameters:
      - name: controlId
        in: path
        required: true
        description: Stable resource identity.
        schema:
          type: string
          description: Stable resource identity.
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/SetCollectionActivityRequest
Requests:
  post:
    operationId: requestCollection
    tags:
      - Collection
    summary: Request one collection passage
    description:
      Requires current global collection-management permission. Returns 202 for an accepted
      or already pending request, 200 for an existing running cycle. Neither adds duplicate work. Paused,
      pausing, unlaunched or closed competition scopes refuse the request. Read the control to observe
      admission/result; there is no individual pool or club rerun. Stale revisions return 409 without
      changes. Read current state after an uncertain result before an explicit retry.
    responses:
      "202":
        description: Current accepted state; no implicit success for work not yet performed.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/CollectionControlResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "409":
        $ref: ../../common/problems.yaml#/responses/Conflict
      "413":
        $ref: ../../common/problems.yaml#/responses/ContentTooLarge
      "415":
        $ref: ../../common/problems.yaml#/responses/UnsupportedMediaType
      "422":
        $ref: ../../common/problems.yaml#/responses/UnprocessableContent
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
      "200":
        description: Current accepted state; no implicit success for work not yet performed.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/CollectionControlResponse
    parameters:
      - name: controlId
        in: path
        required: true
        description: Stable resource identity.
        schema:
          type: string
          description: Stable resource identity.
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/RequestCollectionRequest
Results:
  get:
    operationId: listCollectionResults
    tags:
      - Collection
    summary: Read current scoped results
    description:
      Requires current global collection-management permission. Returns current evidence and
      latest successes, not execution history. A success in another scope never resolves this scope. Diagnostics
      exclude raw payloads and personal values.
    responses:
      "200":
        description: Current accepted state; no implicit success for work not yet performed.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/CollectionResultPageResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
    parameters:
      - name: controlId
        in: path
        required: true
        description: Stable resource identity.
        schema:
          type: string
          description: Stable resource identity.
          format: uuid
      - &id001
        name: page
        in: query
        required: false
        description: Zero-based page.
        schema:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          description: Zero-based page.
          default: 0
      - &id002
        name: size
        in: query
        required: false
        description: Bounded page size.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
          description: Items per page.
Children:
  get:
    operationId: listCollectionSourceChildren
    tags:
      - Collection
    summary: Read discovered source children
    description:
      Requires current global collection-management permission. Returns direct children of
      the source, or a pack in that source. Does not fetch providers or expose mapping shortcuts.
    responses:
      "200":
        description: Current accepted state; no implicit success for work not yet performed.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/DiscoveredCollectionResourcePageResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
    parameters:
      - name: sourceBindingId
        in: path
        required: true
        description: Stable resource identity.
        schema:
          type: string
          description: Stable resource identity.
          format: uuid
      - name: parentId
        in: query
        required: false
        description: Optional parent pack.
        schema:
          type: string
          description: Parent pack identity in this binding.
          format: uuid
      - *id001
      - *id002
