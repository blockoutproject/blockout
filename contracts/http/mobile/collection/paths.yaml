        in: query
        required: false
        description: Optional selected season.
        schema:
          type: string
          description: Selected competition season.
          format: uuid
Control:
  get:
    operationId: getCollectionControl
    tags:
      - Collection
    summary: Read current control state
    description:
      Requires current global collection-management permission. Returns desired activity, pending
      request and confirmed execution independently. No provider call or restart occurs.
    responses:
      "200":
        description: Current activity, pending request and cycle state.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/CollectionControlResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
    parameters:
      - name: controlId
        in: path
        required: true
        description: Stable resource identity.
        schema:
          type: string
          description: Stable resource identity.
          format: uuid
Activity:
  put:
    operationId: setCollectionActivity
    tags:
      - Collection
    summary: Set collection activity
    description:
      Requires current global collection-management permission. Pause cancels pending unstarted
      collection and drains the current cycle. Resume restores ordinary eligibility without
      catch-up, source unlocking or request replay. A
      failed or lost response permits explicit manual retry without a verification read.
    responses:
      "200":
        description: Desired activity saved; pending work cancelled when paused.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/CollectionControlResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "409":
        $ref: ../../common/problems.yaml#/responses/Conflict
      "413":
        $ref: ../../common/problems.yaml#/responses/ContentTooLarge
      "415":
        $ref: ../../common/problems.yaml#/responses/UnsupportedMediaType
      "422":
        $ref: ../../common/problems.yaml#/responses/UnprocessableContent
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
    parameters:
      - name: controlId
        in: path
        required: true
        description: Stable resource identity.
        schema:
          type: string
          description: Stable resource identity.
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/SetCollectionActivityRequest
Requests:
  post:
    operationId: requestCollection
    tags:
      - Collection
    summary: Request one collection passage
    description:
      Requires current global collection-management permission. Returns 202 for an accepted or
      already pending request, 200 for an existing running cycle. Neither adds duplicate work.
      Activity is checked before returning existing work. Competition scopes require an active
      season and a provider enabled for ordinary collection. Read the control to observe admission/result; there is
      no individual pool or club rerun. A failed or lost
      response permits explicit manual retry without a verification read.
    responses:
      "202":
        description: Collection request accepted or already pending.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/CollectionControlResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "409":
        $ref: ../../common/problems.yaml#/responses/Conflict
      "413":
        $ref: ../../common/problems.yaml#/responses/ContentTooLarge
      "415":
        $ref: ../../common/problems.yaml#/responses/UnsupportedMediaType
      "422":
        $ref: ../../common/problems.yaml#/responses/UnprocessableContent
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
      "200":
        description: Existing running cycle; no additional passage requested.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/CollectionControlResponse
    parameters:
      - name: controlId
        in: path
        required: true
        description: Stable resource identity.
        schema:
          type: string
          description: Stable resource identity.
          format: uuid
Results:
  get:
    operationId: listCollectionResults
    tags:
      - CollectionResults
    summary: Read current scoped results
    description:
      Requires the current collection-management grant. Returns one latest result per scope, stage
      and phase within the selected control's provider and season or seasonless family. Applies
      combined filters before pagination. The summary covers the entire control regardless of
      filters or page. Diagnostics exclude private payloads and personal values.
    responses:
      "200":
        description: Current scoped results and retained success/failure evidence.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/CollectionResultPageResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
    parameters:
      - name: controlId
        in: path
        required: true
        description: Stable resource identity.
        schema:
          type: string
          description: Stable resource identity.
          format: uuid
      - $ref: ../../common/parameters.yaml#/Page
      - $ref: ../../common/parameters.yaml#/PageSize
      - name: query
        in: query
        description:
          Case- and accent-insensitive search across known scope and source labels and the stage and phase labels.
          Letter and number sequences form literal terms. Every term must match. Blank means no text filter.
        schema:
          $ref: ../../common/scalars.yaml#/SearchQueryText
      - name: status
        in: query
        description: Restrict results to this outcome.
        schema:
          $ref: ../../common/collection-enums.yaml#/CollectionOutcomeEnum
      - name: sourceId
        in: query
        description: Restrict results to the given source binding within the selected control.
        schema:
          type: string
          format: uuid
          description: Authorized source binding identity.
      - name: stage
        in: query
        description: Restrict results to this stage across both phases.
        schema:
          $ref: ../../common/collection-enums.yaml#/CollectionStageEnum
