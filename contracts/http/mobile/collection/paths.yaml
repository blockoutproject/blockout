Seasons:
  get:
    operationId: listCollectionSeasons
    tags:
      - Collection
    summary: Read known collection seasons
    description:
      Requires current global collection-management permission. Includes preparation, active
      collection and closed history.
    responses:
      "200":
        description: Current accepted state; no implicit success for work not yet performed.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/CollectionSeasonListResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
Season:
  get:
    operationId: getCollectionSeason
    tags:
      - Collection
    summary: Read a collection season
    description:
      Requires current global collection-management permission. Returns current lifecycle and
      preparation revision.
    responses:
      "200":
        description: Current accepted state; no implicit success for work not yet performed.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/CollectionSeasonResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
    parameters:
      - name: seasonId
        in: path
        required: true
        description: Stable resource identity.
        schema:
          type: string
          description: Stable resource identity.
          format: uuid
Closure:
  post:
    operationId: closeCollectionSeason
    tags:
      - Collection
    summary: Close a season definitively
    description:
      Requires current global collection-management permission. Requires the exact displayed
      label. Cancels unstarted work; already-running cycles may finish once. Other seasons and club controls
      are unchanged. No reopening. Stale revisions return 409 without changes. Read current state after
      an uncertain result before an explicit retry.
    responses:
      "200":
        description: Current accepted state; no implicit success for work not yet performed.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/CollectionSeasonResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "409":
        $ref: ../../common/problems.yaml#/responses/Conflict
      "413":
        $ref: ../../common/problems.yaml#/responses/ContentTooLarge
      "415":
        $ref: ../../common/problems.yaml#/responses/UnsupportedMediaType
      "422":
        $ref: ../../common/problems.yaml#/responses/UnprocessableContent
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
    parameters:
      - name: seasonId
        in: path
        required: true
        description: Stable resource identity.
        schema:
          type: string
          description: Stable resource identity.
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/CloseCollectionSeasonRequest
Launch:
  post:
    operationId: launchCollectionSources
    tags:
      - Collection
    summary: Launch qualified sources
    description:
      Requires current global collection-management permission. Atomically locks the selected
      qualified sources in a preparing or active season and activates that season. Already periodically
      launched sources are unchanged. References locked by initial reconstruction may be activated without
      editing them. Mapping readiness is irrelevant; pauses are preserved. Repeating already-launched
      selection has no extra effect. Stale revisions return 409 without changes. Read current state after
      an uncertain result before an explicit retry.
    responses:
      "200":
        description: Current accepted state; no implicit success for work not yet performed.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/CollectionSeasonResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "409":
        $ref: ../../common/problems.yaml#/responses/Conflict
      "413":
        $ref: ../../common/problems.yaml#/responses/ContentTooLarge
      "415":
        $ref: ../../common/problems.yaml#/responses/UnsupportedMediaType
      "422":
        $ref: ../../common/problems.yaml#/responses/UnprocessableContent
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
    parameters:
      - name: seasonId
        in: path
        required: true
        description: Stable resource identity.
        schema:
          type: string
          description: Stable resource identity.
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/LaunchCollectionSourcesRequest
Sources:
  get:
    operationId: listCollectionSources
    tags:
      - Collection
    summary: Read supported season sources
    description:
      Requires current global collection-management permission. Lists source evidence and preparation
      state, without classification readiness.
    responses:
      "200":
        description: Current accepted state; no implicit success for work not yet performed.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/SourceBindingListResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
    parameters:
      - name: seasonId
        in: path
        required: true
        description: Stable resource identity.
        schema:
          type: string
          description: Stable resource identity.
          format: uuid
  post:
    operationId: createCollectionSource
    tags:
      - Collection
    summary: Add a missing supported source
    description:
      Requires current global collection-management permission. Creates a missing organizer/championship
      binding only in an open season. Rejects unsupported identities and duplicate bindings; existing
      locked bindings are never replaced. Stale revisions return 409 without changes. Read current state
      after an uncertain result before an explicit retry.
    responses:
      "201":
        description: Current accepted state; no implicit success for work not yet performed.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
          Location:
            description: URI of the created resource.
            schema:
              type: string
              description: Created resource URI.
              format: uri-reference
              example: /administration/source-bindings/00000000-0000-4000-8000-000000000001
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/SourceBindingResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "409":
        $ref: ../../common/problems.yaml#/responses/Conflict
      "413":
        $ref: ../../common/problems.yaml#/responses/ContentTooLarge
      "415":
        $ref: ../../common/problems.yaml#/responses/UnsupportedMediaType
      "422":
        $ref: ../../common/problems.yaml#/responses/UnprocessableContent
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
    parameters:
      - name: seasonId
        in: path
        required: true
        description: Stable resource identity.
        schema:
          type: string
          description: Stable resource identity.
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ./schemas.yaml#/CreateSourceBindingRequest
