        $ref: ../../common/problems.yaml#/responses/Forbidden
      "503":
        $ref: ../../common/problems.yaml#/responses/ServiceUnavailable
    parameters:
      - name: seasonId
        in: query
        required: false
        description: Optional selected season.
        schema:
          type: string
          description: Selected competition season.
          format: uuid
Control:
  get:
    operationId: getCollectionControl
    tags:
      - Collection
    summary: Read current control state
    description:
      Requires current global collection-management permission. Returns desired activity, pending
      request and confirmed execution independently. No provider call or restart occurs.
    responses:
      "200":
        description: Current accepted state; no implicit success for work not yet performed.
        headers:
          Cache-Control:
