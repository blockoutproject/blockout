Matches:
  get:
    operationId: listMatches
    tags:
      - Sporting
    summary: Read a sporting calendar
    description:
      Supply exactly one clubId, teamId or poolId. A club requires seasonId; other selectors forbid it.
      Returns seven complete nonempty days at most. Preserve category, timeZone and selector for nextDay continuation.
      Empty dates are skipped. Concurrent moves may be absent until refresh; deduplicate appended match identities.
      Ordinary access is public; explicit maintenance bypass requires a valid authorized mobile token. Current visibility
      restrictions always apply.
    security:
      - {}
      - MobileToken: []
    parameters:
      - name: clubId
        in: query
        required: false
        description: Club selector; exactly one resource selector is required.
        schema:
          type: string
          description: Club identity.
          format: uuid
      - name: teamId
        in: query
        required: false
        description: Team selector; exactly one resource selector is required.
        schema:
          type: string
          description: Team identity.
          format: uuid
      - name: poolId
        in: query
        required: false
        description: Pool selector; exactly one resource selector is required.
        schema:
          type: string
          description: Pool identity.
          format: uuid
      - name: seasonId
        in: query
        required: false
        description: Required with clubId, forbidden otherwise.
        schema:
          type: string
          description: Club sporting season.
          format: uuid
      - $ref: ./parameters.yaml#/Category
      - $ref: ./parameters.yaml#/TimeZone
      - $ref: ./parameters.yaml#/NextDay
      - $ref: ../access/parameters.yaml#/MaintenanceBypass
    responses:
      "200":
        description: Current authorized representation.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/MatchCalendarResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "503":
        $ref: ../access/problems.yaml#/responses/AccessUnavailable
