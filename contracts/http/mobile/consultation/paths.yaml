Club:
  get:
    operationId: getClub
    tags:
      - Sporting
    summary: Read a club
    description:
      Returns effective presentation, permitted contacts, municipality and viewable seasons. Ordinary
      access is public; explicit maintenance bypass requires a valid authorized mobile token. Current visibility
      restrictions always apply.
    security:
      - {}
      - MobileToken: []
    parameters:
      - name: clubId
        in: path
        required: true
        description: Stable club identity.
        schema:
          type: string
          description: Stable club identity.
          format: uuid
      - $ref: ../access/parameters.yaml#/MaintenanceBypass
    responses:
      "200":
        description: Current authorized representation.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/ClubDetailResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "503":
        $ref: ../access/problems.yaml#/responses/AccessUnavailable
