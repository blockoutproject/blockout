Document:
  get:
    operationId: getMatchDocument
    tags:
      - Sporting
    summary: Read a match PDF
    description:
      Relays a qualified document without an archive. Information needs no result; scoresheet/statistics
      require a definitive result and statistics is professional only. A missing/ineligible reference is not found;
      a failed supplier read is unavailable. No arbitrary provider URL is accepted. Ordinary access is public; explicit
      maintenance bypass requires a valid authorized mobile token. Current visibility restrictions always apply.
    security:
      - {}
      - MobileToken: []
    parameters:
      - name: matchId
        in: path
        required: true
        description: Stable match identity.
        schema:
          type: string
          description: Stable match identity.
          format: uuid
      - name: documentKind
        in: path
        required: true
        description: Official document use.
        schema:
          $ref: ./schemas.yaml#/MatchDocumentKindEnum
      - $ref: ../access/parameters.yaml#/MaintenanceBypass
    responses:
      "200":
        description: Current authorized representation.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/pdf:
            schema:
              type: string
              description: Binary resource bytes.
              format: binary
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "404":
        $ref: ../../common/problems.yaml#/responses/NotFound
      "503":
        $ref: ../access/problems.yaml#/responses/AccessUnavailable
