Clubs:
  get:
    operationId: listClubs
    tags:
      - Sporting
    summary: Discover or search clubs
    description: >-
      Matches current public/source club names, applicable verified aliases and the currently permitted city.
      Empty text returns at most five examples; nonempty text returns up to twenty matches with continuation.
      Every meaningful term applies. Relevance favors direct matches; order may change
      when data changes. Current visibility always applies. Public access requires no account;
      explicit maintenance bypass requires a valid authorized token. Invalid parameter combinations are rejected.
    security:
      - {}
      - MobileToken: []
    parameters:
      - $ref: ./parameters.yaml#/Query
      - $ref: ./parameters.yaml#/Cursor
      - $ref: ./parameters.yaml#/ExampleIds
      - $ref: ../access/parameters.yaml#/MaintenanceBypass
    responses:
      "200":
        description: Eligible examples or textual matches; incomplete evaluation never returns a successful empty list or false end.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/ClubSearchResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "503":
        $ref: ../access/problems.yaml#/responses/AccessUnavailable
