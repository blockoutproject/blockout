Options:
  get:
    operationId: getSportingSearchOptions
    tags:
      - Sporting
    summary: Read sporting search choices
    description: >-
      Returns current seasons with viewable resources of the requested type and active division choices.
      A successful empty catalogue differs from a failed read. Public access requires no account;
      explicit maintenance bypass requires a valid authorized token.
    security:
      - {}
      - MobileToken: []
    parameters:
      - name: resourceType
        in: query
        required: true
        description: Team or pool choices; clubs have no sporting filters.
        schema:
          $ref: ./schemas.yaml#/SearchResourceTypeEnum
      - $ref: ../access/parameters.yaml#/MaintenanceBypass
    responses:
      "200":
        description: Current choices for the requested resource type.
        headers:
          Cache-Control:
            $ref: ../../common/headers.yaml#/NoStore
        content:
          application/json:
            schema:
              $ref: ./schemas.yaml#/SportingSearchOptionsResponse
      "400":
        $ref: ../../common/problems.yaml#/responses/BadRequest
      "401":
        $ref: ../../common/problems.yaml#/responses/Unauthorized
      "403":
        $ref: ../../common/problems.yaml#/responses/Forbidden
      "503":
        $ref: ../access/problems.yaml#/responses/AccessUnavailable
