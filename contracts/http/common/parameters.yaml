Page:
  name: page
  in: query
  required: false
  description: Zero-based page.
  schema:
    type: integer
    format: int64
    minimum: 0
    maximum: 9007199254740991
    default: 0
    description: Zero-based page.
PageSize:
  name: size
  in: query
  required: false
  description: Bounded page size.
  schema:
    type: integer
    minimum: 1
    maximum: 200
    default: 50
    description: Items per page.
