NoStore:
  description: >-
    HTTP caches must not store the response, whether public or authenticated, including errors; this does not define the application-owned in-memory query cache.
  schema:
    type: string
    enum: [no-store]
BearerChallenge:
  description: Bearer authentication challenge returned with every 401 response.
  schema:
    type: string
    example: Bearer
AcceptPatchJson:
  description: Supported atomic JSON change-document media type for this resource.
  schema:
    type: string
    enum: [application/json]
AcceptPatchMultipart:
  description: Supported atomic multipart change-document media type for this resource.
  schema:
    type: string
    enum: [multipart/form-data]
