schemas:
  ProblemResponse:
    type: object
    description: >-
      RFC 9457 error response. Consumers use type as the machine identifier, never title or provider
      text. Conflict details identify only resources visible to the authorized caller.
    additionalProperties: true
    properties:
      type:
        type: string
        description: >-
          Stable URI identifying the problem category. Clients use generic error handling for an
          unrecognized type.
        format: uri
      title:
        type: string
        description: Human-readable category, not a machine code.
      status:
        type: integer
        description: HTTP status of this response.
        minimum: 400
        maximum: 599
      detail:
        type: string
        description: Safe explanation without secrets, personal contact values or raw supplier data.
      instance:
        type: string
        description: Optional URI reference identifying this occurrence; opaque to clients, without sensitive URLs or internal topology.
        format: uri-reference
      conflictingResourceIds:
        type: array
        description: >-
          Pool or team identities involved in a classification conflict and visible to the authorized
          caller.
        items:
          type: string
          description: Conflicting pool or team identity.
          format: uuid
    required:
      - type
      - title
      - status
responses:
  BadRequest:
    description: Malformed or invalid request (urn:blockout:problem:invalid-request); no write.
    headers:
      Cache-Control:
        $ref: ./headers.yaml#/NoStore
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/ProblemResponse"
  Unauthorized:
    description: >-
      Missing or invalid token, including expiration or an unexpected issuer or audience
      (urn:blockout:problem:unauthenticated); no write.
    headers:
      WWW-Authenticate:
        $ref: ./headers.yaml#/BearerChallenge
      Cache-Control:
        $ref: ./headers.yaml#/NoStore
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/ProblemResponse"
  Forbidden:
    description: >-
      Authenticated caller lacks the required client authorization, scope or business permission
      (urn:blockout:problem:forbidden); no write.
    headers:
      Cache-Control:
        $ref: ./headers.yaml#/NoStore
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/ProblemResponse"
  NotFound:
    description: Unknown or deliberately unavailable resource (urn:blockout:problem:not-found).
    headers:
      Cache-Control:
        $ref: ./headers.yaml#/NoStore
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/ProblemResponse"
  Conflict:
    description: >-
      Conflict with current state (urn:blockout:problem:conflict); no command effects.
      Specific types distinguish a stale editing revision (urn:blockout:problem:stale-revision),
      an invalid acquisition cycle context (urn:blockout:problem:invalid-cycle-context),
      conflicting sporting identities (urn:blockout:problem:identity-conflict), incompatible
      classification (urn:blockout:problem:classification-conflict), or an already-used username
      (urn:blockout:problem:username-unavailable), where applicable to the operation.
    headers:
      Cache-Control:
        $ref: ./headers.yaml#/NoStore
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/ProblemResponse"
  ContentTooLarge:
    description: Request or image exceeds the documented bound (urn:blockout:problem:payload-too-large); no write.
    headers:
      Cache-Control:
        $ref: ./headers.yaml#/NoStore
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/ProblemResponse"
  UnsupportedMediaType:
    description: Unsupported request or image media type (urn:blockout:problem:unsupported-media-type); no write.
    headers:
      Cache-Control:
        $ref: ./headers.yaml#/NoStore
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/ProblemResponse"
  UnprocessableContent:
    description: >-
      Readable request with rejected business content (urn:blockout:problem:unprocessable-content);
      no command effects. Specific types distinguish invalid image content
      (urn:blockout:problem:invalid-image), an invalid sporting observation
      (urn:blockout:problem:invalid-observation), or missing usable provider email when creating an
      account (urn:blockout:problem:provider-email-unavailable), where applicable to the operation.
    headers:
      Cache-Control:
        $ref: ./headers.yaml#/NoStore
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/ProblemResponse"
  ServiceUnavailable:
    description: >-
      Processing unavailable (urn:blockout:problem:unavailable). An interrupted mutation may have committed;
      follow the operation’s documented retry behavior without automatic replay. Ingestion resumes
      through the next ordinary collection.
    headers:
      Cache-Control:
        $ref: ./headers.yaml#/NoStore
    content:
      application/problem+json:
        schema:
          $ref: "#/schemas/ProblemResponse"
