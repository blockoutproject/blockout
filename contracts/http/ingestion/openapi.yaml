openapi: 3.0.4
info:
  title: Blockout ingestion API
  version: 0.1.0
  description: >-
    Collector API for submitting contextual sporting observations. Requests use an authorized
    collection cycle; the backend owns accepted sporting identities and state. JSON request bodies
    are limited to 8388608 bytes. Oversized input is rejected before writes, never truncated or
    automatically split; image bodies have their own documented limit.
servers:
  - url: /
    description: Same-origin backend; deployment supplies its environment URL.
tags:
  - name: Collection
    description: Source qualification, collection control and current operational evidence.
  - name: Sporting
    description: >-
      Sporting observations and their acceptance outcomes.
security:
  - CollectorToken: []
paths:
  /ingestion/collector-runtime:
    $ref: ./collection/paths.yaml#/Runtime
  /ingestion/collection-work:
    $ref: ./collection/paths.yaml#/Work
  /ingestion/collection-cycles:
    $ref: ./collection/paths.yaml#/Cycles
  /ingestion/collection-cycles/{cycleId}:
    $ref: ./collection/paths.yaml#/Cycle
  /ingestion/collection-cycles/{cycleId}/targets:
    $ref: ./collection/paths.yaml#/Targets
  /ingestion/collection-cycles/{cycleId}/results:
    $ref: ./collection/paths.yaml#/Results
  /ingestion/collection-cycles/{cycleId}/completion:
    $ref: ./collection/paths.yaml#/Completion
  /ingestion/source-bindings/{sourceBindingId}/validation:
    $ref: ./collection/paths.yaml#/Validation
  /ingestion/season-source-observations:
    $ref: ./collection/paths.yaml#/SeasonDiscovery
  /ingestion/source-bindings/{sourceBindingId}/catalog-observations:
    post:
      operationId: observeSportingCatalog
      tags:
        - Sporting
      summary: Accept qualified catalog discovery
      description: >-
        Accepts pool references atomically within the authorized source-season binding. An invalid or
        unauthorized entry refuses the whole catalog without changes. Only a complete current catalog
        may reconcile absence; partial discovery preserves unobserved references. Absence never
        withdraws pools from another season. Results follow the input pool order, including duplicates.
      responses:
        "415":
          $ref: ../common/problems.yaml#/responses/UnsupportedMediaType
        "200":
          description: >-
            Catalog outcomes in input order. All changes commit together; a stale catalog changes nothing.
          headers:
            Cache-Control:
              $ref: ../common/headers.yaml#/NoStore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogOutcomeInternalResponse"
        "400":
          $ref: ../common/problems.yaml#/responses/BadRequest
        "401":
          $ref: ../common/problems.yaml#/responses/Unauthorized
        "403":
          $ref: ../common/problems.yaml#/responses/Forbidden
        "404":
          $ref: ../common/problems.yaml#/responses/NotFound
        "409":
          $ref: ../common/problems.yaml#/responses/Conflict
        "413":
          $ref: ../common/problems.yaml#/responses/ContentTooLarge
        "422":
          $ref: ../common/problems.yaml#/responses/UnprocessableContent
        "503":
          $ref: ../common/problems.yaml#/responses/ServiceUnavailable
      parameters:
        - name: sourceBindingId
          in: path
          required: true
          description: Backend identity in the authorized cycle scope.
          schema:
            type: string
            description: Backend identity in the authorized cycle scope.
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogObservationInternalRequest"
  /ingestion/pools/{poolId}/calendar-observations:
    post:
      operationId: observePoolCalendar
      tags:
        - Sporting
      summary: Integrate a bounded calendar
      description: >-
        Processes each match independently, rechecking its authorized scope before writing, and returns
        per-match outcomes. An item refusal preserves earlier commits. An accepted score and its
        required internal notification updates succeed together. Only a complete, current calendar
        with every match successfully processed may reconcile absence. Older match observations are
        ignored in full. A timeout may leave some matches committed; use the next ordinary collection
        instead of automatically replaying the request.
      responses:
        "415":
          $ref: ../common/problems.yaml#/responses/UnsupportedMediaType
        "200":
          description: >-
            Calendar processing outcomes; HTTP success does not mean every match was accepted.
          headers:
            Cache-Control:
              $ref: ../common/headers.yaml#/NoStore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarOutcomeInternalResponse"
        "400":
          $ref: ../common/problems.yaml#/responses/BadRequest
        "401":
          $ref: ../common/problems.yaml#/responses/Unauthorized
        "403":
          $ref: ../common/problems.yaml#/responses/Forbidden
        "404":
          $ref: ../common/problems.yaml#/responses/NotFound
        "409":
          $ref: ../common/problems.yaml#/responses/Conflict
        "413":
          $ref: ../common/problems.yaml#/responses/ContentTooLarge
        "422":
          $ref: ../common/problems.yaml#/responses/UnprocessableContent
        "503":
          $ref: ../common/problems.yaml#/responses/ServiceUnavailable
      parameters:
        - name: poolId
          in: path
          required: true
          description: Backend identity in the authorized cycle scope.
          schema:
            type: string
            description: Backend identity in the authorized cycle scope.
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalendarObservationInternalRequest"
  /ingestion/matches/{matchId}/detail-observations:
    post:
      operationId: observeMatchDetail
      tags:
        - Sporting
      summary: Accept known-match detail
      description: >-
        Updates an already-known match using the same logical observation order as calendars, without
        page-specific priority. Does not create matches or teams or restore calendar presence. The
        accepted result and required internal notification updates succeed together.
      responses:
        "415":
          $ref: ../common/problems.yaml#/responses/UnsupportedMediaType
        "200":
          description: >-
            Processing outcome for the submitted observation; inspect outcome to distinguish
            acceptance, no change, stale input and rejection.
          headers:
            Cache-Control:
              $ref: ../common/headers.yaml#/NoStore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationOutcomeInternalResponse"
        "400":
          $ref: ../common/problems.yaml#/responses/BadRequest
        "401":
          $ref: ../common/problems.yaml#/responses/Unauthorized
        "403":
          $ref: ../common/problems.yaml#/responses/Forbidden
        "404":
          $ref: ../common/problems.yaml#/responses/NotFound
        "409":
          $ref: ../common/problems.yaml#/responses/Conflict
        "413":
          $ref: ../common/problems.yaml#/responses/ContentTooLarge
        "422":
          $ref: ../common/problems.yaml#/responses/UnprocessableContent
        "503":
          $ref: ../common/problems.yaml#/responses/ServiceUnavailable
      parameters:
        - name: matchId
          in: path
          required: true
          description: Backend identity in the authorized cycle scope.
          schema:
            type: string
            description: Backend identity in the authorized cycle scope.
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MatchDetailObservationInternalRequest"
  /ingestion/pools/{poolId}/standings-observations:
    post:
      operationId: observePoolStandings
      tags:
        - Sporting
      summary: Replace a usable official table
      description:
        Replace the table atomically, preserving source order and unmatched rows. Never create
        sporting identities from standings.
      responses:
        "415":
          $ref: ../common/problems.yaml#/responses/UnsupportedMediaType
        "200":
          description: >-
            Processing outcome for the submitted observation; inspect outcome to distinguish
            acceptance, no change, stale input and rejection.
          headers:
            Cache-Control:
              $ref: ../common/headers.yaml#/NoStore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationOutcomeInternalResponse"
        "400":
          $ref: ../common/problems.yaml#/responses/BadRequest
        "401":
          $ref: ../common/problems.yaml#/responses/Unauthorized
        "403":
          $ref: ../common/problems.yaml#/responses/Forbidden
        "404":
          $ref: ../common/problems.yaml#/responses/NotFound
        "409":
          $ref: ../common/problems.yaml#/responses/Conflict
        "413":
          $ref: ../common/problems.yaml#/responses/ContentTooLarge
        "422":
          $ref: ../common/problems.yaml#/responses/UnprocessableContent
        "503":
          $ref: ../common/problems.yaml#/responses/ServiceUnavailable
      parameters:
        - name: poolId
          in: path
          required: true
          description: Backend identity in the authorized cycle scope.
          schema:
            type: string
            description: Backend identity in the authorized cycle scope.
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StandingsObservationInternalRequest"
  /ingestion/clubs/{clubId}/detail-observations:
    post:
      operationId: observeClubDetails
      tags:
        - Sporting
      summary: Accept permitted club page details
      description:
        Known clubs only; source fields are independent of manual/hidden modes. Page failure
        establishes no withdrawal.
      responses:
        "415":
          $ref: ../common/problems.yaml#/responses/UnsupportedMediaType
        "200":
          description: >-
            Processing outcome for the submitted observation; inspect outcome to distinguish
            acceptance, no change, stale input and rejection.
          headers:
            Cache-Control:
              $ref: ../common/headers.yaml#/NoStore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationOutcomeInternalResponse"
        "400":
          $ref: ../common/problems.yaml#/responses/BadRequest
        "401":
          $ref: ../common/problems.yaml#/responses/Unauthorized
        "403":
          $ref: ../common/problems.yaml#/responses/Forbidden
        "404":
          $ref: ../common/problems.yaml#/responses/NotFound
        "409":
          $ref: ../common/problems.yaml#/responses/Conflict
        "413":
          $ref: ../common/problems.yaml#/responses/ContentTooLarge
        "422":
          $ref: ../common/problems.yaml#/responses/UnprocessableContent
        "503":
          $ref: ../common/problems.yaml#/responses/ServiceUnavailable
      parameters:
        - name: clubId
          in: path
          required: true
          description: Backend identity in the authorized cycle scope.
          schema:
            type: string
            description: Backend identity in the authorized cycle scope.
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClubDetailsInternalRequest"
  /ingestion/clubs/{clubId}/locality-observations:
    post:
      operationId: observeClubLocality
      tags:
        - Sporting
      summary: Accept current locality evidence
      description:
        Accept only the effective locality revision. Empty/ambiguous stays unresolved; located
        requires both coordinates and forbids ambiguity. Technical failure does not erase a valid point.
      responses:
        "415":
          $ref: ../common/problems.yaml#/responses/UnsupportedMediaType
        "200":
          description: >-
            Processing outcome for the submitted observation; inspect outcome to distinguish
            acceptance, no change, stale input and rejection.
          headers:
            Cache-Control:
              $ref: ../common/headers.yaml#/NoStore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationOutcomeInternalResponse"
        "400":
          $ref: ../common/problems.yaml#/responses/BadRequest
        "401":
          $ref: ../common/problems.yaml#/responses/Unauthorized
        "403":
          $ref: ../common/problems.yaml#/responses/Forbidden
        "404":
          $ref: ../common/problems.yaml#/responses/NotFound
        "409":
          $ref: ../common/problems.yaml#/responses/Conflict
        "413":
          $ref: ../common/problems.yaml#/responses/ContentTooLarge
        "422":
          $ref: ../common/problems.yaml#/responses/UnprocessableContent
        "503":
          $ref: ../common/problems.yaml#/responses/ServiceUnavailable
      parameters:
        - name: clubId
          in: path
          required: true
          description: Backend identity in the authorized cycle scope.
          schema:
            type: string
            description: Backend identity in the authorized cycle scope.
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClubLocalityObservationInternalRequest"
  /ingestion/teams/{teamId}/source-logo-observations:
    post:
      operationId: observeProfessionalTeamLogo
      tags:
        - Sporting
      summary: Accept an LNV logo
      description:
        Professional team in the authorized existing calendar cycle only. Validate actual PNG/JPEG
        bytes and decodability, at most 5242880 bytes. Image failure is independent of match acceptance.
        Retain only latest valid source image; manual logo and optional club relation are never modified.
      responses:
        "200":
          description: >-
            Processing outcome for the submitted observation; inspect outcome to distinguish
            acceptance, no change, stale input and rejection.
          headers:
            Cache-Control:
              $ref: ../common/headers.yaml#/NoStore
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObservationOutcomeInternalResponse"
        "400":
          $ref: ../common/problems.yaml#/responses/BadRequest
        "401":
          $ref: ../common/problems.yaml#/responses/Unauthorized
        "403":
          $ref: ../common/problems.yaml#/responses/Forbidden
        "404":
          $ref: ../common/problems.yaml#/responses/NotFound
        "409":
          $ref: ../common/problems.yaml#/responses/Conflict
        "413":
          $ref: ../common/problems.yaml#/responses/ContentTooLarge
        "415":
          $ref: ../common/problems.yaml#/responses/UnsupportedMediaType
        "422":
          $ref: ../common/problems.yaml#/responses/UnprocessableContent
        "503":
          $ref: ../common/problems.yaml#/responses/ServiceUnavailable
      parameters:
        - name: teamId
          in: path
          required: true
          description: Known professional team.
          schema:
            type: string
            description: Known professional team.
            format: uuid
        - name: cycleId
          in: query
          required: true
          description: >-
            Existing authorized collection cycle.
          schema:
            type: string
            description: Cycle identity.
            format: uuid
        - name: readOrdinal
          in: query
          required: true
          description: Ordinal allocated before reading this logo.
          schema:
            type: integer
            description: Read ordinal.
            format: int64
            minimum: 1
        - name: observedAt
          in: query
          required: true
          description: UTC observation completion time.
          schema:
            type: string
            description: Freshness only.
            format: date-time
      requestBody:
        required: true
        description: Actual image bytes; no URL fetching or base64 calendar payload.
        content:
          image/png:
            schema:
              type: string
              format: binary
              description: PNG/JPEG bytes, at most 5 MiB.
          image/jpeg:
            schema:
              type: string
              format: binary
              description: PNG/JPEG bytes, at most 5 MiB.
components:
  securitySchemes:
    CollectorToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Bearer token for the dedicated collector client in this environment, with sporting:ingest
        scope. The backend validates issuer, audience, expiry and client identity. Mobile tokens
        cannot authorize ingestion.
  schemas:
    ObservationContextInternalRequest:
      type: object
      description: >-
        Authorized collection context. The backend resolves source, season, scope, logical order and
        reconstruction mode and current collector incarnation from cycleId; callers cannot override them
        with request flags. Each domain write checks this context under the runtime fence through commit.
      additionalProperties: false
      properties:
        cycleId:
          type: string
          description: >-
            Existing authorized collection cycle; completed cycles or cycles outside the requested
            scope cannot authorize new writes.
          format: uuid
        readOrdinal:
          type: integer
          description:
            Strictly increasing ordinal allocated before each provider read within this cycle,
            not after completion.
          format: int64
          minimum: 1
        observedAt:
          type: string
          description: UTC completion time of this provider read; freshness only, never ordering authority.
          format: date-time
      required:
        - cycleId
        - readOrdinal
        - observedAt
    ObservationOutcomeEnum:
      type: string
      description: Per-scope processing result; stale or rejected is not successful integration.
      enum:
        - accepted
        - unchanged
        - stale
        - rejected
    ObservationOutcomeInternalResponse:
      type: object
      description: One safe, attributable acceptance outcome. No supplier payload or personal values.
      additionalProperties: true
      properties:
        sourceReference:
          type: string
          description:
            Native reference within the request scope, or the bounded row locator when identity
            was unreadable.
        outcome:
          $ref: "#/components/schemas/ObservationOutcomeEnum"
        resourceId:
          type: string
          description: Resolved Blockout identity, when known.
          format: uuid
        reasonType:
          type: string
          description: Stable machine problem type for a refusal or stale observation.
          format: uri
        homeTeamId:
          type: string
          description:
            Resolved home team for a successful calendar match, allowing source-logo submission
            without a separate lookup.
          format: uuid
        awayTeamId:
          type: string
          description: Resolved away team for a successful calendar match.
          format: uuid
      required:
        - sourceReference
        - outcome
    CalendarOutcomeInternalResponse:
      type: object
      description:
        HTTP success means the envelope was processed, not that every sporting observation
        succeeded. Previously committed matches survive interruption.
      additionalProperties: true
      properties:
        outcomes:
          type: array
          description:
            One outcome per distinct match reference in order of its first occurrence in matches,
            followed by one rejected outcome per failures element in its input order. Identical
            duplicates collapse; contradictory duplicates have one rejected outcome. Context-only
            slots produce no outcome. sourceReference identifies the match or submitted failure.
          items:
            $ref: "#/components/schemas/ObservationOutcomeInternalResponse"
        acceptedCount:
          type: integer
          description: Number of changed match items committed.
          minimum: 0
        unchangedCount:
          type: integer
          description: Number of already-current match items.
          minimum: 0
        staleCount:
          type: integer
          description: Number rejected as old or superseded.
          minimum: 0
        rejectedCount:
          type: integer
          description: Number of failed/ambiguous items.
          minimum: 0
        absenceReconciled:
          type: boolean
          description:
            True only after fully successful, complete, current finalization. Historical wholly
            empty input always preserves retained data.
      required:
        - outcomes
        - acceptedCount
        - unchangedCount
        - staleCount
        - rejectedCount
        - absenceReconciled
    TeamCandidateInternalRequest:
      type: object
      description:
        Identity-bearing calendar participant. A place awaiting a qualifier belongs in contextSlots,
        not here. Provider comes from the authorized pool binding.
      additionalProperties: false
      properties:
        nativeTeamReference:
          type: string
          description:
            Required LNV TeamID inside the championship binding. FFVB may omit when its contextual
            name/club identity is authoritative.
          minLength: 1
        sourceName:
          type: string
          description:
            Original supplier label; comparison normalizes only case, excess spaces and apostrophe
            style.
          minLength: 1
        clubReference:
          type: string
          description:
            Required attributable FFVB club code, preserving leading zeros. Omitted for a professional
            team; ingestion cannot attach a professional club.
          minLength: 1
        clubSourceName:
          type: string
          description: Available attributable club label; omission never invents a name.
          minLength: 1
      required:
        - sourceName
    SetScoreInternalRequest:
      type: object
      description:
        One interpretable played set in source order. Invalid set detail is omitted without
        discarding the usable overall result.
      additionalProperties: false
      properties:
        home:
          type: integer
          description: Home points in this set.
          minimum: 0
        away:
          type: integer
          description: Away points in this set.
          minimum: 0
      required:
        - home
        - away
    ResultStateEnum:
      $ref: ../common/sporting-enums.yaml#/ResultStateEnum
    MatchFactsInternalRequest:
      type: object
      description:
        Field proposals from one valid observation. Omission preserves useful accepted data.
        Explicit null is a qualified removal/absence, never a parsing failure. An old whole observation
        is ignored before mapping.
      additionalProperties: false
      properties:
        localDate:
          type: string
          description:
            Published local date; null withdraws the usable date and makes the match unavailable
            publicly.
          format: date
          nullable: true
        localTime:
          type: string
          description:
            Confirmed HH:mm local time; null means unknown. FFVB 00:00 is omitted/null unless
            midnight is explicitly confirmed.
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          nullable: true
        timeZone:
          type: string
          description:
            IANA zone established by source context, ordinarily Europe/Paris. Ambiguous/nonexistent
            times do not yield an invented instant.
          example: Europe/Paris
        result:
          type: object
          description:
            "Omitted: preserve accepted result. Null: explicit official withdrawal, also removing
            sets. Object: usable overall result proposal."
          additionalProperties: false
          properties:
            state:
              $ref: "#/components/schemas/ResultStateEnum"
            homeSets:
              type: integer
              description: Published home set total; absent for nonnumeric special notation.
              minimum: 0
            awaySets:
              type: integer
              description: Published away set total; absent for nonnumeric special notation.
              minimum: 0
            specialLabel:
              type: string
              description: Recognized official forfeit/penalty notation, independent of result finality; present for a special result.
              minLength: 1
          required:
            - state
          nullable: true
        sets:
          type: array
          description:
            "Omitted: retain only compatible earlier sets with old freshness. Null: qualified
            removal. Empty: no played sets stated."
          items:
            $ref: "#/components/schemas/SetScoreInternalRequest"
          nullable: true
        venueName:
          type: string
          description: Available authorized match venue label, never inferred from club municipality.
          nullable: true
        venueAddress:
          type: string
          description: Available authorized match venue address; not a team practice-location association.
          nullable: true
        referees:
          type: array
          description: Permitted published referee names. Omitted preserves accepted values; null explicitly removes them.
          nullable: true
          items:
            type: string
            description: Sporting-purpose referee name, never a contact detail.
        professionalStreamUrl:
          type: string
          format: uri
          nullable: true
          description: Published professional HTTP(S) stream destination. Omitted preserves; null withdraws. Never overwrites a user contribution.
        informationSheet:
          $ref: "#/components/schemas/InformationSheetInternalRequest"
        scoresheetUrl:
          type: string
          format: uri
          nullable: true
          description: Published qualified PDF URL for professional matches; omit for acquisition failure, null for qualified withdrawal. Amateur delivery uses the known official match context.
        statisticsUrl:
          type: string
          format: uri
          nullable: true
          description: Published professional statistics PDF URL; omission preserves, null explicitly withdraws. Not extracted player statistics.
    InformationSheetInternalRequest:
      type: object
      description: Qualified official form locator. Omission preserves an existing association; null explicitly withdraws it. Professional qualification requires verified same-season/championship team associations and a unique exact participants/date match; an established code survives rescheduling.
      additionalProperties: false
      nullable: true
      properties:
        seasonLabel:
          type: string
          description: Qualified provider season value, preserving its expected form representation.
        organizerReference:
          type: string
          description: Qualified provider organizer code; not inferred from a display label.
        matchCode:
          type: string
          minLength: 1
          description: Qualified document match code, not a replacement sporting identity.
      required:
        - seasonLabel
        - organizerReference
        - matchCode
    CalendarMatchInternalRequest:
      type: object
      description:
        One attributable match candidate. Identities and source context are distinct from optional
        facts.
      additionalProperties: false
      properties:
        detailUrl:
          type: string
          format: uri
          description: Published supported match-detail entry without credentials; omission preserves an existing usable reference.
        nativeMatchReference:
          type: string
          description:
            Native match code or mID in this qualified pool/phase, never a participant/date
            key.
          minLength: 1
        home:
          $ref: "#/components/schemas/TeamCandidateInternalRequest"
        away:
          $ref: "#/components/schemas/TeamCandidateInternalRequest"
        facts:
          $ref: "#/components/schemas/MatchFactsInternalRequest"
      required:
        - nativeMatchReference
        - home
        - away
        - facts
    ContextSlotKindEnum:
      type: string
      description: Recognized non-match context, not a supplier parse failure.
      enum:
        - bye
        - undeterminedQualifier
    CalendarContextSlotInternalRequest:
      type: object
      description:
        Recognized place without two established sporting teams. Creates no match or fictional
        club/team.
      additionalProperties: false
      properties:
        sourceReference:
          type: string
          description: Attributable source slot or row locator.
          minLength: 1
        kind:
          $ref: "#/components/schemas/ContextSlotKindEnum"
      required:
        - sourceReference
        - kind
    AcquisitionFailureInternalRequest:
      type: object
      description:
        A bounded local adapter failure reported explicitly so missing rows never become proof
        of absence.
      additionalProperties: false
      properties:
        sourceReference:
          type: string
          description: Native reference or sanitized row locator.
          minLength: 1
        reasonType:
          type: string
          description: Safe machine reason type, not provider text or a raw row.
          format: uri
      required:
        - sourceReference
        - reasonType
    CalendarObservationInternalRequest:
      type: object
      description:
        One source calendar/phase. Maximum total across matches, contextSlots and failures
        is 1000 entries and 8 MiB JSON. Never truncate or split into independently complete calendars.
        Identical duplicate references collapse; conflicting duplicates are rejected locally and block
        absence reconciliation.
      additionalProperties: false
      properties:
        context:
          $ref: "#/components/schemas/ObservationContextInternalRequest"
        complete:
          type: boolean
          description:
            All expected source sections were read and qualified, including any explicit local
            failures. True alone does not authorize absence reconciliation.
        matches:
          type: array
          description: Attributable match candidates.
          items:
            $ref: "#/components/schemas/CalendarMatchInternalRequest"
          maxItems: 1000
        contextSlots:
          type: array
          description: Recognized non-match source context.
          items:
            $ref: "#/components/schemas/CalendarContextSlotInternalRequest"
          maxItems: 1000
        failures:
          type: array
          description: Explicit local acquisition failures; any entry prevents absence reconciliation.
          items:
            $ref: "#/components/schemas/AcquisitionFailureInternalRequest"
          maxItems: 1000
      required:
        - context
        - complete
        - matches
        - contextSlots
        - failures
    MatchDetailObservationInternalRequest:
      type: object
      description:
        Enrich an already-known match only. Does not create identities or restore participation/calendar
        presence.
      additionalProperties: false
      properties:
        context:
          $ref: "#/components/schemas/ObservationContextInternalRequest"
        facts:
          $ref: "#/components/schemas/MatchFactsInternalRequest"
      required:
        - context
        - facts
    CatalogPoolInternalRequest:
      type: object
      description:
        Native pool identity inside one provider season binding. Compound references use explicit
        parts; normal matchday never substitutes for tour/group.
      additionalProperties: false
      properties:
        packReference:
          type: string
          description: >-
            Native grouping that supplies default acquisition classification.
          minLength: 1
        competitionReference:
          type: string
          description: FFVB competition or LNV championship reference.
          minLength: 1
        poolReference:
          type: string
          description: FFVB pool/group or LNV phase reference.
          minLength: 1
        tourReference:
          type: string
          description: Only a separately published FFVB tour context; absent otherwise.
          minLength: 1
        groupReference:
          type: string
          description: Only a separately qualified group within a shared export; absent otherwise.
          minLength: 1
        calendarUrl:
          type: string
          format: uri
          description: Published supported calendar entry without credentials; omission preserves the previous usable reference.
        standingsUrl:
          type: string
          format: uri
          description: Published supported standings entry when available; omission does not invent absence.
        sourceName:
          type: string
          description: Current source label, independent of manual display naming.
          minLength: 1
      required:
        - packReference
        - competitionReference
        - poolReference
        - sourceName
    CatalogObservationInternalRequest:
      type: object
      description: >-
        Complete or partial catalog within a known source-season binding, at most 8388608 bytes of JSON.
        The catalog is accepted atomically. Identical qualified identities collapse for writing;
        conflicting duplicates reject the entire request. Partial discovery never proves absence.
        Catalog observations create no teams.
      additionalProperties: false
      properties:
        context:
          $ref: "#/components/schemas/ObservationContextInternalRequest"
        complete:
          type: boolean
          description:
            Authoritative seasonal catalog fully qualified; false allows attributable presence
            only.
        pools:
          type: array
          description: Discovered pool/phase references; conflicting native duplicates reject the catalog.
          items:
            $ref: "#/components/schemas/CatalogPoolInternalRequest"
      required:
        - context
        - complete
        - pools
    CatalogOutcomeInternalResponse:
      type: object
      description: >-
        Discovered pool references and acceptance outcomes. Resolved references remain subject to
        current collection eligibility.
      additionalProperties: true
      properties:
        outcomes:
          type: array
          description: >-
            Exactly one outcome for each input pools element in the same order, including duplicates;
            array position correlates the full compound identity. sourceReference is the submitted
            poolReference, not a globally unique key. A current successful catalog contains only
            accepted/unchanged outcomes; an older catalog returns stale outcomes without changes.
          items:
            $ref: "#/components/schemas/ObservationOutcomeInternalResponse"
        absenceReconciled:
          type: boolean
          description: Only a complete current seasonal catalog can establish catalog absence.
      required:
        - outcomes
        - absenceReconciled
    StandingRowInternalRequest:
      type: object
      description:
        Official row preserved even without a resolvable current team. No row creates an identity
        or restores participation.
      additionalProperties: false
      properties:
        sourceName:
          type: string
          description: Published row label.
          minLength: 1
        nativeTeamReference:
          type: string
          description: Qualified native team reference when the provider actually supplies it.
        position:
          type: integer
          description: Officially stated rank; omitted when unstated, never renumbered.
          minimum: 1
        statistics:
          type: object
          description:
            Intentional map from published column label to its exact display value; includes
            special ratios. Missing keys are unknown, not zero. Only standings statistics, never raw records.
          additionalProperties:
            type: string
            description: Published statistic text.
      required:
        - sourceName
        - statistics
    StandingsObservationInternalRequest:
      type: object
      description:
        Atomic replacement of one usable official table. A failed/unreadable table is not submitted
        as an empty success.
      additionalProperties: false
      properties:
        context:
          $ref: "#/components/schemas/ObservationContextInternalRequest"
        columns:
          type: array
          description:
            Published statistic column labels, in display order; every statistics key must
            belong here.
          items:
            type: string
            description: Source statistic column label.
            minLength: 1
          uniqueItems: true
        rows:
          type: array
          description: Source order retained without local rank calculation.
          items:
            $ref: "#/components/schemas/StandingRowInternalRequest"
      required:
        - context
        - columns
        - rows
    ClubDetailsInternalRequest:
      type: object
      description: >-
        Source-managed club values; manual corrections and deliberate absences remain protected.
        Omitted invalid or unavailable values preserve previous usable source facts. Null explicitly
        withdraws a source value. Current privacy restrictions apply.
      additionalProperties: false
      properties:
        context:
          $ref: "#/components/schemas/ObservationContextInternalRequest"
        sourceName:
          type: string
          description: Attributable current source name.
          minLength: 1
        address:
          type: string
          description:
            "Postal street address; does not locate a gymnasium. Omitted: no proposal. Null:
            qualified removal."
          nullable: true
        city:
          type: string
          description: "Municipality label. Omitted: no proposal. Null: qualified removal."
          nullable: true
        postalCode:
          type: string
          description:
            "Postal identifier as text, preserving leading zeros. Omitted: no proposal. Null:
            qualified removal."
          nullable: true
        email:
          type: string
          description:
            "Contact email permitted by current privacy rules. Omitted: no proposal. Null:
            qualified removal."
          nullable: true
        phone:
          type: string
          description: "Published contact telephone text. Omitted: no proposal. Null: qualified removal."
          nullable: true
        website:
          type: string
          description:
            "Public website URL without credentials. Omitted: no proposal. Null: qualified
            removal."
          nullable: true
      required:
        - context
    GeocodingOutcomeEnum:
      type: string
      description: Qualified locality outcome; transport failure is not an empty success.
      enum:
        - located
        - empty
        - ambiguous
    ClubLocalityObservationInternalRequest:
      type: object
      description: >-
        Geocoding result for the effective locality context. Only the current locality revision can
        publish coordinates; current privacy restrictions apply.
      additionalProperties: false
      properties:
        context:
          $ref: "#/components/schemas/ObservationContextInternalRequest"
        localityRevision:
          type: string
          description: >-
            Opaque revision supplied with the locality work item; an old revision cannot publish
            coordinates.
        outcome:
          $ref: "#/components/schemas/GeocodingOutcomeEnum"
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          description: WGS84 municipality latitude, required only for located.
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          description: WGS84 municipality longitude, required only for located.
      required:
        - context
        - localityRevision
        - outcome
