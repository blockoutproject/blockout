services:
  netstack:
    image: qmcgaw/gluetun:latest
    container_name: netstack
    cap_add: [NET_ADMIN]
    ports:
      - 8888:8888
    environment:
      TZ: Europe/Paris
      VPN_SERVICE_PROVIDER: nordvpn
      VPN_TYPE: openvpn
      OPENVPN_USER: XXX
      OPENVPN_PASSWORD: XXX
      OPENVPN_PROTOCOL: udp
      FIREWALL: "on"
      HTTPPROXY: "on"
      SERVER_COUNTRIES: France,Belgium,Netherlands
    restart: unless-stopped
