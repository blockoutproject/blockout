spring:
  application:
    name: blockout-collector
  main:
    web-application-type: none
    keep-alive: true
  security:
    oauth2:
      client:
        registration:
          ingestion:
            provider: auth0
            client-id: ${BLOCKOUT_INGESTION_CLIENT_ID}
            client-secret: ${BLOCKOUT_INGESTION_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_post
            scope: sporting:ingest
        provider:
          auth0:
            token-uri: ${BLOCKOUT_INGESTION_TOKEN_URI}

blockout:
  ingestion:
    base-url: ${BLOCKOUT_INGESTION_BASE_URL:http://localhost:8080}
    audience: ${BLOCKOUT_INGESTION_AUDIENCE}
    timeout: ${BLOCKOUT_INGESTION_TIMEOUT:15s}

management:
  otlp:
    metrics:
      export:
        enabled: false

logging:
  structured:
    format:
      console: ecs
    json:
      # Only backend account cleanup may carry the approved original-target references.
      include:
        - "@timestamp"
        - log
        - log.level
        - log.logger
        - service
        - service.name
        - service.environment
        - error
        - error.type
        - operation
        - stage
        - scope
        - outcome
        - provider
        - reason
        - affected_count
        - partial_count
        - last_success_at
