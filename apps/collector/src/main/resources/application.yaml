spring:
  application:
    name: blockout-collector
  main:
    web-application-type: none
    keep-alive: true
  security:
    oauth2:
      client:
        registration:
          ingestion:
            provider: auth0
            client-id: ${BLOCKOUT_INGESTION_CLIENT_ID}
            client-secret: ${BLOCKOUT_INGESTION_CLIENT_SECRET}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_post
            scope: sporting:ingest
        provider:
          auth0:
            token-uri: ${BLOCKOUT_INGESTION_TOKEN_URI}

blockout:
  acquisition:
    # Conservative starting limits, shared per provider across all seasons and families.
    # Live provider qualification remains separate from the bounded transport tests.
    ffvb-origins: ${BLOCKOUT_ACQUISITION_FFVB_ORIGINS:https://www.ffvb.org,https://www.ffvbbeach.org}
    lnv-origins: ${BLOCKOUT_ACQUISITION_LNV_ORIGINS:https://www.lnv.fr,https://lnv-web.dataproject.com,https://images.dataproject.com}
    ign-origins: ${BLOCKOUT_ACQUISITION_IGN_ORIGINS:https://data.geopf.fr}
    timeout: ${BLOCKOUT_ACQUISITION_TIMEOUT:15s}
    max-response-bytes: ${BLOCKOUT_ACQUISITION_MAX_RESPONSE_BYTES:8388608}
    max-redirects: ${BLOCKOUT_ACQUISITION_MAX_REDIRECTS:3}
    concurrency-per-provider: ${BLOCKOUT_ACQUISITION_CONCURRENCY:2}
    permits-per-period: ${BLOCKOUT_ACQUISITION_PERMITS_PER_PERIOD:1}
    refresh-period: ${BLOCKOUT_ACQUISITION_REFRESH_PERIOD:1s}
    permit-timeout: ${BLOCKOUT_ACQUISITION_PERMIT_TIMEOUT:5s}
    document-team-associations: []
  ingestion:
    base-url: ${BLOCKOUT_INGESTION_BASE_URL:http://localhost:8080}
    # Empty fallback lets Bean Validation reject an absent audience instead of placeholder text.
    audience: ${BLOCKOUT_INGESTION_AUDIENCE:}
    timeout: ${BLOCKOUT_INGESTION_TIMEOUT:15s}

management:
  otlp:
    metrics:
      export:
        enabled: false

logging:
  structured:
    format:
      console: ecs
    json:
      # Only backend account cleanup may carry the approved original-target references.
      include:
        - "@timestamp"
        - log
        - log.level
        - log.logger
        - service
        - service.name
        - service.environment
        - error
        - error.type
        - operation
        - cycleId
        - collection_control
        - collection_entry_usable
        - stage
        - scope
        - phase
        - outcome
        - provider
        - reason
        - affected_count
        - partial_count
        - last_success_at
