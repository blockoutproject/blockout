spring:
  application:
    name: blockout-backend
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
      data-source-properties:
        connectTimeout: 3
        socketTimeout: 5
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      validate-group-membership: true
      show-details: never
      show-components: never
      status:
        order: down,out-of-service,unknown,up
        http-mapping:
          down: 503
          out-of-service: 503
          unknown: 503
      group:
        readiness:
          include: readinessState,db
          additional-path: server:/health
