# Disposable search restoration only; start source and restore databases successively.
services:
  postgres:
    image: postgres:18.6
    mem_limit: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-admin-only
      POSTGRES_DB: postgres
      BLOCKOUT_APP_PASSWORD: local-app-only
      BLOCKOUT_MIGRATION_PASSWORD: local-migration-only
    ports:
      - "127.0.0.1:5551:5432"
    volumes:
      - postgres-source-data:/var/lib/postgresql
      - "${QUALIFICATION_ROOT:?Set the repository root}/infra/postgres/init-roles.sql:/docker-entrypoint-initdb.d/10-blockout.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blockout"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [source]
  postgres-restore:
    image: postgres:18.6
    mem_limit: 512m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-admin-only
      POSTGRES_DB: postgres
      BLOCKOUT_APP_PASSWORD: local-app-only
      BLOCKOUT_MIGRATION_PASSWORD: local-migration-only
    ports:
      - "127.0.0.1:5551:5432"
    volumes:
      - postgres-restore-data:/var/lib/postgresql
      - "${QUALIFICATION_ROOT:?Set the repository root}/infra/postgres/init-roles.sql:/docker-entrypoint-initdb.d/10-blockout.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blockout"]
      interval: 2s
      timeout: 5s
      retries: 30
    profiles: [restore]
    networks: [restore]
  opensearch:
    image: opensearchproject/opensearch:3.9.0
    mem_limit: 1536m
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9251:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - "${QUALIFICATION_ROOT:?Set the repository root}/infra/opensearch/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro"
      - "${QUALIFICATION_PRIVATE_DIR:?Set the private qualification directory}/opensearch/tls:/usr/share/opensearch/config/tls:ro"
      - "${QUALIFICATION_PRIVATE_DIR:?Set the private qualification directory}/opensearch/security:/usr/share/opensearch/config/opensearch-security:ro"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --silent --cacert config/tls/ca.pem -o /dev/null -w '%{http_code}' https://localhost:9200 | grep -q 401",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks: [search]
volumes:
  postgres-source-data:
    name: "${COMPOSE_PROJECT_NAME}-source-${QUALIFICATION_RUN:?Set a fresh disposable run name}"
  postgres-restore-data:
    name: "${COMPOSE_PROJECT_NAME}-restore-${QUALIFICATION_RUN:?Set a fresh disposable run name}"
  opensearch-data:
networks:
  source:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_icc: "false"
  restore:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_icc: "false"
  search:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
      com.docker.network.bridge.enable_icc: "false"
