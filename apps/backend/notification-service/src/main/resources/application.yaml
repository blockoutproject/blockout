server:
  port: 8092

spring:
  application:
    name: ${APPLICATION_NAME:notifications}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER}

  config:
    import: optional:file:.env.local[.properties]
    on-missing-location: fail

  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${JPA_SHOW_SQL:false}
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}

blockout:
  events:
    consumers:
      matches-v1-enabled: ${NOTIFICATION_MATCH_EVENTS_V1_ENABLED:true}
      matches-v2-enabled: ${NOTIFICATION_MATCH_EVENTS_V2_ENABLED:false}
      favorites-v1-enabled: ${NOTIFICATION_FAVORITE_EVENTS_V1_ENABLED:true}
      favorites-v2-enabled: ${NOTIFICATION_FAVORITE_EVENTS_V2_ENABLED:false}

auth0:
  domain: ${AUTH0_DOMAIN}
  client-id: ${AUTH0_CLIENT_ID}
  client-secret: ${AUTH0_CLIENT_SECRET}
  audience: ${AUTH0_AUDIENCE}
  default-user-role-id: ${AUTH0_DEFAULT_ROLE_ID}
  token-refresh-delay: 24h

api:
  user:
    url: ${USER_API_URL}
  pool:
    url: ${POOL_API_URL}
  team:
    url: ${TEAM_API_URL}

expo:
  access-token: ${EXPO_PUSH_ACCESS_TOKEN}
