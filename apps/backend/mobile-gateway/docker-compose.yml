services:
  blockout-mobile-gateway:
    build: .
    ports:
      - ${SERVER_PORT}:8088
    environment:
      DATASOURCE_URL: ${DATASOURCE_URL}
      DATASOURCE_USERNAME: ${DATASOURCE_USERNAME}
      DATASOURCE_PASSWORD: ${DATASOURCE_PASSWORD}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      AUTH0_ISSUER: ${AUTH0_ISSUER}
      MATCH_API_URL: ${MATCH_API_URL}
      TEAM_API_URL: ${TEAM_API_URL}
      POOL_API_URL: ${POOL_API_URL}
      CONFIG_API_URL: ${CONFIG_API_URL}
      COMPETITION_API_URL: ${COMPETITION_API_URL}
      CLUB_API_URL: ${CLUB_API_URL}
    depends_on:
      postgres:
        condition: service_healthy
      
  postgres:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: ${DATASOURCE_USERNAME}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD}
      POSTGRES_DB: ${DATASOURCE_NAME}
    ports:
      - 5435:5432
    volumes:
      - ./local/postgres-data:/var/lib/postgresql/data
      - ./local/postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATASOURCE_USERNAME} -d ${DATASOURCE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5