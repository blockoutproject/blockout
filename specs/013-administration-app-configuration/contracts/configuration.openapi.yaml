{
  "openapi": "3.0.3",
  "info":
    {
      "title": "F12 administration and access configuration",
      "version": "1.0.0",
      "description": "Documentary source. Adopt under contracts/public/configuration using F13 shared Problem and generator tooling. No runtime or generated client is delivered. Companion contracts define cross-field validation and access semantics.",
    },
  "tags":
    [
      {
        "name": "Access configuration",
        "description": "Public access snapshot and authorized resource management.",
      },
    ],
  "security": [{ "ConfigurationAccountBearer": [] }],
  "paths":
    {
      "/api/v1/access-configuration":
        {
          "get":
            {
              "operationId": "readAccessConfiguration",
              "tags": ["Access configuration"],
              "summary": "readAccessConfiguration",
              "description": "public. Maintenance-exempt. Native minimum restrictions remain a mobile navigation rule, not a trustworthy HTTP version assertion.",
              "responses":
                {
                  "200":
                    {
                      "description": "Current validated persisted state (including unchanged revision for a valid no-op).",
                      "headers":
                        {
                          "Cache-Control":
                            {
                              "description": "Configuration/capability state must not be HTTP cached. F12 owns explicit local fallback.",
                              "schema":
                                { "type": "string", "enum": ["no-store"] },
                            },
                        },
                      "content":
                        {
                          "application/json":
                            {
                              "schema":
                                {
                                  "$ref": "#/components/schemas/AccessConfiguration",
                                },
                            },
                        },
                    },
                  "500":
                    { "$ref": "#/components/responses/ConfigurationError500" },
                  "503":
                    { "$ref": "#/components/responses/ConfigurationError503" },
                },
              "security": [],
            },
        },
      "/api/v1/me/capabilities":
        {
          "get":
            {
              "operationId": "readCurrentCapabilities",
              "tags": ["Access configuration"],
              "summary": "readCurrentCapabilities",
              "description": "Requires current usable F05 account. Maintenance-exempt. Native minimum restrictions remain a mobile navigation rule, not a trustworthy HTTP version assertion.",
              "responses":
                {
