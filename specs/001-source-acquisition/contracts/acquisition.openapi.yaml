openapi: 3.0.3
info:
  title: F01 source acquisition and administration
  version: 1.0.0
  description:
    Documentary design only; no generated/runtime qualification. Apply README.md semantic rules and F13
    errors/security. Request objects reject extra fields; response consumers accept additive fields while validating
    consumed values.
tags:
  - name: Acquisition
    description: F01 operations; F02 retains sports integration.
paths:
  /api/v1/admin/acquisition/seasons:
    post:
      operationId: prepareAcquisitionSeason
      tags:
        - Acquisition
      summary: Prepare a published season
      description:
        Prepare a published season. See README.md for preconditions, privacy, replay and uncertain-outcome
        semantics.
      security:
        - AcquisitionUserBearer: []
      responses:
        "201":
          description: Inspect explicit state; HTTP success does not imply supplier coverage or completion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonDetailResponse"
        "400":
          $ref: "#/components/responses/AcquisitionError400"
        "401":
          $ref: "#/components/responses/AcquisitionError401"
        "403":
          $ref: "#/components/responses/AcquisitionError403"
        "404":
          $ref: "#/components/responses/AcquisitionError404"
        "409":
          $ref: "#/components/responses/AcquisitionError409"
        "422":
          $ref: "#/components/responses/AcquisitionError422"
        "503":
          $ref: "#/components/responses/AcquisitionError503"
        "500":
          $ref: "#/components/responses/AcquisitionError500"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSeasonRequest"
