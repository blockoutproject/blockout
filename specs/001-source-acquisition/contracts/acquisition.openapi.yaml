      responses:
        "200":
          description: Inspect explicit state; HTTP success does not imply supplier coverage or completion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeasonDetailResponse"
        "400":
          $ref: "#/components/responses/AcquisitionError400"
        "401":
          $ref: "#/components/responses/AcquisitionError401"
        "403":
          $ref: "#/components/responses/AcquisitionError403"
        "404":
          $ref: "#/components/responses/AcquisitionError404"
        "409":
          $ref: "#/components/responses/AcquisitionError409"
        "422":
          $ref: "#/components/responses/AcquisitionError422"
        "503":
          $ref: "#/components/responses/AcquisitionError503"
        "500":
          $ref: "#/components/responses/AcquisitionError500"
      parameters:
        - name: seasonId
          in: path
          required: true
          description: Owning resource identity.
          schema:
            type: string
            description: Resource UUID.
            minLength: 1
            maxLength: 36
            format: uuid
        - name: cursor
          in: query
          required: false
          description: Opaque continuation from the previous page; absent for first page.
          schema:
            type: string
            description: Continuation token.
            minLength: 1
            maxLength: 2000
        - name: revision
          in: query
          required: false
          description: Required with cursor; changing selection returns 409.
          schema:
            type: integer
            format: int64
            minimum: 0
            description: Pinned read revision.
            maximum: 9007199254740991
