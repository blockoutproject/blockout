openapi: 3.0.3
info:
  title: F03 public sporting consultation
  version: 1.0.0
  description:
    Documentary design source. Adopt through F13 roots and generated Java/TypeScript consumers; no runtime
    delivered. Conditional rules in read-semantics.md are mandatory.
tags:
  - name: Sport consultation
    description: Focused current public reads owned by F03 over sport application interfaces.
paths:
  /api/v1/clubs/{clubId}:
    get:
      operationId: readClub
      tags:
        - Sport consultation
      summary: Read Club
      description:
        Apply read-semantics.md and F02 visibility. No Pro restriction, source collection, mutation or
        private follow state. This operation refreshes only its own data.
      security:
        - {}
        - ConsultationAccountBearer: []
      parameters:
        - name: clubId
          in: path
          required: true
          description: Exact sporting resource identity; current visibility is rechecked.
          schema:
            type: string
            description: Immutable resource ID.
            minLength: 1
            maxLength: 36
            format: uuid
        - name: X-Blockout-Maintenance-Bypass
          in: header
          required: false
          description: Explicit in-memory operator choice; current account permission still required.
          schema:
            type: string
            enum:
              - "true"
      responses:
        "200":
          description: Current validated read; independent source freshness is carried separately.
          headers:
            Cache-Control:
              description: Explicit feature-owned retention only; no HTTP cache.
              schema:
                type: string
                enum:
                  - no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClubDetailResponse"
        "400":
          $ref: "#/components/responses/ConsultationError400"
        "401":
          $ref: "#/components/responses/ConsultationError401"
        "403":
          $ref: "#/components/responses/ConsultationError403"
        "404":
          $ref: "#/components/responses/ConsultationError404"
        "500":
          $ref: "#/components/responses/ConsultationError500"
        "503":
          $ref: "#/components/responses/ConsultationError503"
