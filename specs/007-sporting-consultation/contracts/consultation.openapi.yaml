components:
  securitySchemes:
    ConsultationAccountBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Optional account authentication; never required for ordinary public consultation.
  parameters:
    Category:
      name: category
      in: query
      required: true
      description: Requested presentation category.
      schema:
        $ref: "#/components/schemas/CalendarCategoryEnum"
    TimeZone:
      name: timeZone
      in: query
      required: true
      description: Valid IANA grouping zone; continuation preserves initial value.
      schema:
        type: string
        description: IANA time-zone identifier.
        minLength: 1
        maxLength: 100
    Season:
      name: seasonId
      in: query
      required: true
      description: Explicit F02 sporting season, never local calendar year.
      schema:
        type: string
        description: Season ID.
        minLength: 1
        maxLength: 36
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Context-bound continuation from previous response; omit to start over.
      schema:
        type: string
        description: Opaque validated cursor.
        minLength: 1
        maxLength: 2048
  schemas:
    CalendarCategoryEnum:
      type: string
      description: Presentation classification at the response evaluation instant.
      enum:
        - UPCOMING
        - COMPLETED
    ScheduleKindEnum:
      type: string
      description: Source precision retained in public consultation.
      enum:
        - INSTANT
        - DATE_ONLY
    ResultStateEnum:
      type: string
      description: Official aggregate availability/finality, not a time-derived result.
      enum:
        - ABSENT
        - PROVISIONAL
        - DEFINITIVE
    SectionStateEnum:
      type: string
      description: Availability of an independent section.
      enum:
        - AVAILABLE
        - ABSENT
        - UNAVAILABLE
    DocumentStateEnum:
      type: string
      description: Usable reference, known absence, unavailable reference or unmet result condition.
      enum:
        - AVAILABLE
        - ABSENT
        - UNAVAILABLE
        - INELIGIBLE
    StandingsStateEnum:
      type: string
      description: Official table state, independent of calendar/participation.
      enum:
        - AVAILABLE
        - NOT_PUBLISHED
        - UNAVAILABLE
    ResourceIdentityResponse:
      type: object
      description: Current effective sporting identity; no guessed links.
      additionalProperties: true
      properties:
        id:
          type: string
          description: Immutable resource ID.
          minLength: 1
          maxLength: 36
          format: uuid
        name:
          type: string
          description: Effective permitted display name.
          minLength: 1
          maxLength: 240
        logoUrl:
          type: string
          description: Absolute qualified HTTPS URL without userinfo; validate destination/redirect policy.
          minLength: 1
          maxLength: 2048
          format: uri
          pattern: ^https://
      required:
        - id
        - name
    SeasonResponse:
      type: object
      description: Canonical chronological season with exact published display label.
      additionalProperties: true
      properties:
        id:
          type: string
          description: Canonical season ID.
          minLength: 1
          maxLength: 36
          format: uuid
        label:
          type: string
          description: Published season label.
          minLength: 1
          maxLength: 80
        startYear:
          type: integer
          description: Qualified published starting year, never match-date year.
          minimum: 1
          maximum: 9999
      required:
        - id
        - label
        - startYear
    FreshnessResponse:
      type: object
      description: Actual source/integration evidence; absent means unknown.
      additionalProperties: true
      properties:
        sourceObservedAt:
          type: string
          description: Actual source observation time.
          minLength: 1
          maxLength: 40
          format: date-time
          pattern: Z$
        integratedAt:
          type: string
          description: Actual accepted integration time.
          minLength: 1
          maxLength: 40
          format: date-time
          pattern: Z$
        sourceUnavailable:
          type: boolean
          description: True only when latest relevant source failure is established.
    ClassificationResponse:
      type: object
      description: Known permitted sporting classification.
      additionalProperties: true
      properties:
        division:
          $ref: "#/components/schemas/ResourceIdentityResponse"
        format:
          $ref: ../../002-sporting-data/contracts/admin.openapi.yaml#/components/schemas/FormatEnum
        gender:
          $ref: ../../002-sporting-data/contracts/admin.openapi.yaml#/components/schemas/GenderEnum
    MunicipalPointResponse:
      type: object
      description: Qualified municipal location; never a gymnasium or phone position.
      additionalProperties: true
      properties:
        municipalityCode:
          type: string
          description: Qualified municipality code.
          minLength: 1
          maxLength: 20
        municipalityName:
          type: string
          description: Municipality display name.
          minLength: 1
          maxLength: 240
        latitude:
          type: number
          format: double
          description: Finite WGS84 latitude in degrees.
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          description: Finite WGS84 longitude in degrees.
          minimum: -180
          maximum: 180
      required:
        - municipalityCode
        - municipalityName
        - latitude
        - longitude
    ClubContactsResponse:
      type: object
      description: Only current permitted values; no fallback to suppressed automatic fields.
      additionalProperties: true
      properties:
        phone:
          type: string
          description: Usable contact phone.
          minLength: 1
          maxLength: 100
        email:
          type: string
          description: Usable contact email.
          minLength: 1
          maxLength: 320
          format: email
        website:
          type: string
          description: Usable absolute HTTP or HTTPS website without userinfo.
          minLength: 1
          maxLength: 2048
          format: uri
          pattern: ^https?://
        address:
          type: string
          description: Permitted address; not an asserted gymnasium.
          minLength: 1
          maxLength: 1000
        city:
          type: string
          description: Permitted city.
          minLength: 1
          maxLength: 240
        postalCode:
          type: string
          description: Permitted postal code.
          minLength: 1
