    ProblemResponse:
      description: F13 problem or F12 owned maintenance extension. MAINTENANCE_ACTIVE requires the typed maintenance branch and is classified before retries; validate this conditional rule before caching.
      anyOf:
        - $ref: ../../005-accounts-identity/contracts/problem.schema.yaml
        - $ref: ../../013-administration-app-configuration/contracts/configuration.openapi.yaml#/components/schemas/MaintenanceProblem
  responses:
    ConsultationError400:
      description: Malformed request, unsupported query or INVALID_CALENDAR_CURSOR.
      headers:
        Cache-Control:
          description: Explicit feature-owned retention only; no HTTP cache.
          schema:
            type: string
            enum:
              - no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemResponse"
    ConsultationError401:
      description: Supplied credentials invalid; guest reads need no token.
      headers:
        Cache-Control:
          description: Explicit feature-owned retention only; no HTTP cache.
          schema:
            type: string
            enum:
              - no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemResponse"
    ConsultationError403:
      description: Account/authentication refusal under F05.
      headers:
        Cache-Control:
          description: Explicit feature-owned retention only; no HTTP cache.
          schema:
            type: string
            enum:
              - no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemResponse"
    ConsultationError404:
      description: NOT_FOUND or DOCUMENT_UNAVAILABLE without hidden-resource disclosure.
      headers:
        Cache-Control:
          description: Explicit feature-owned retention only; no HTTP cache.
          schema:
            type: string
            enum:
              - no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemResponse"
    ConsultationError409:
      description: DOCUMENT_REFERENCE_CHANGED; reread current detail before another attempt.
      headers:
        Cache-Control:
          description: Explicit feature-owned retention only; no HTTP cache.
          schema:
            type: string
            enum:
              - no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemResponse"
    ConsultationError410:
      description: DOCUMENT_EXPIRED only with established evidence.
      headers:
        Cache-Control:
          description: Explicit feature-owned retention only; no HTTP cache.
          schema:
            type: string
            enum:
              - no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemResponse"
    ConsultationError500:
      description: Controlled internal failure.
      headers:
        Cache-Control:
          description: Explicit feature-owned retention only; no HTTP cache.
          schema:
            type: string
            enum:
              - no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemResponse"
    ConsultationError502:
      description: DOCUMENT_INVALID_RESPONSE; invalid binary is not automatically retryable.
      headers:
        Cache-Control:
          description: Explicit feature-owned retention only; no HTTP cache.
          schema:
            type: string
            enum:
              - no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemResponse"
    ConsultationError503:
      description: Typed F12 maintenance/admission or dependency failure; classify code before retry.
      headers:
        Cache-Control:
          description: Explicit feature-owned retention only; no HTTP cache.
          schema:
            type: string
            enum:
              - no-store
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemResponse"
