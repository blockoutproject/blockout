name: CI Push

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main

concurrency:
  group: ci-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - name: Validate repository configuration
        run: |
          npm run validate:env
          npm run validate:docs
          npm run validate:backend-enums-generated
          npm run validate:generated-untracked
          npm exec nx show projects

      - name: Validate contract sources
        run: |
          npm exec nx run @blockout/contracts:test
          npm exec nx run @blockout/contracts:lint-openapi-source

      - name: Generate contract-derived artifacts
        run: |
          NX_SKIP_NX_CACHE=true npm exec nx run @blockout/contracts:generate-contracts
          NX_SKIP_NX_CACHE=true npm exec nx run @blockout/contracts:generate-event-contracts
          NX_SKIP_NX_CACHE=true npm exec nx run @blockout/mobile:codegen
          NX_SKIP_NX_CACHE=true npm exec nx run @blockout/contracts:generate-python-clients

      - name: Validate generated contract boundaries
        run: |
          npm exec nx run @blockout/contracts:test-event-contracts
          npm run validate:wire-casing
          npm exec nx run @blockout/contracts:typecheck

      - name: Verify deterministic REST contract generation
        run: node tools/scripts/verify-generated-output-determinism.mjs libs/shared/contracts/generated/specs apps/backend/pom.xml -- npm exec nx run @blockout/contracts:generate-contracts

      - name: Verify deterministic event contract generation
        run: node tools/scripts/verify-generated-output-determinism.mjs libs/shared/contracts/generated/events apps/backend/event-contracts/src/generated/java -- npm exec nx run @blockout/contracts:generate-event-contracts

      - name: Verify deterministic mobile client generation
        run: node tools/scripts/verify-generated-output-determinism.mjs apps/frontend/mobile/src/api/generated/mobile-gateway -- node_modules/.bin/orval --config apps/frontend/mobile/orval.config.ts

      - name: Verify deterministic Python client generation
        run: node tools/scripts/verify-generated-output-determinism.mjs libs/shared/contracts/clients/python/src/blockout_contract_clients -- npm exec nx run @blockout/contracts:generate-python-clients

      - name: Recheck generated-file ownership
        run: |
          npm run validate:generated-untracked
          git diff --exit-code -- apps/backend/pom.xml

      - uses: actions/upload-artifact@v4
        with:
          name: contract-generated-artifacts
          retention-days: 1
          path: |
            libs/shared/contracts/generated
            apps/backend/event-contracts/src/generated
            apps/frontend/mobile/src/api/generated
            libs/shared/contracts/clients/python/src/blockout_contract_clients

  backend:
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: contract-generated-artifacts
          path: .

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile Maven reactor
        run: mvn -f apps/backend/pom.xml -DskipTests compile

      - name: Validate backend Dockerfiles
        run: for file in apps/backend/*/Dockerfile; do docker build --check --file "$file" apps/backend || exit 1; done

  mobile:
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: contract-generated-artifacts
          path: .

      - name: Validate mobile form boundary
        run: npm exec nx run @blockout/mobile:validate-form-boundary

      - name: Test mobile form contracts
        run: npm exec nx run @blockout/mobile:test-form-contracts

      - name: Typecheck mobile application
        run: npm exec nx run @blockout/mobile:typecheck

      - name: Export Android bundle
        run: npm exec nx run @blockout/mobile:export --platform=android

  scrapers:
    needs: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: contract-generated-artifacts
          path: .

      - name: Install local contract client wheel
        run: python -m pip install libs/shared/contracts/clients/python

      - name: Test Python contract client boundary
        run: npm exec nx run @blockout/contracts:test-python-clients

      - name: Validate scraper syntax
        run: |
          python -m compileall -q apps/scrapers/competition-scraper
          python -m compileall -q apps/scrapers/club-scraper

      - name: Build competition scraper image
        run: docker build --file apps/scrapers/competition-scraper/Dockerfile --tag blockout-shadow/competition-scraper:${{ github.sha }} .

      - name: Build club scraper image
        run: docker build --file apps/scrapers/club-scraper/Dockerfile --tag blockout-shadow/club-scraper:${{ github.sha }} .

  local-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate Docker Compose configuration
        run: docker compose --file infra/compose/docker-compose.third-party.yml --file infra/compose/docker-compose.app.yml config --quiet
