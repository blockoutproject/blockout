name: CI Push

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - main

concurrency:
  group: ci-push-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile Maven reactor
        run: mvn -f apps/backend/pom.xml -DskipTests compile

      - name: Validate backend Dockerfiles
        run: for file in apps/backend/*/Dockerfile; do docker build --check --file "$file" apps/backend || exit 1; done

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate environment examples
        run: npm run validate:env

      - name: Validate documentation links
        run: npm run validate:docs

      - name: Validate Nx project graph
        run: npm exec nx show projects

      - name: Typecheck reserved contract boundary
        run: npm exec nx run @blockout/contracts:typecheck

      - name: Typecheck mobile application
        run: npm exec nx run @blockout/mobile:typecheck

      - name: Export Android bundle
        run: npm exec nx run @blockout/mobile:export --platform=android

  scrapers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate scraper syntax
        run: |
          python -m compileall -q apps/scrapers/competition-scraper
          python -m compileall -q apps/scrapers/club-scraper

      - name: Build competition scraper image
        run: docker build --tag blockout-shadow/competition-scraper:${{ github.sha }} apps/scrapers/competition-scraper

      - name: Build club scraper image
        run: docker build --tag blockout-shadow/club-scraper:${{ github.sha }} apps/scrapers/club-scraper

  local-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate Docker Compose configuration
        run: docker compose --file infra/compose/docker-compose.third-party.yml --file infra/compose/docker-compose.app.yml config --quiet
