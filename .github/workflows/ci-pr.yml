name: CI Pull Request

on:
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compile Maven reactor
        run: mvn -f apps/backend/pom.xml -DskipTests compile

      - name: Validate backend Dockerfiles
        run: for file in apps/backend/*/Dockerfile; do docker build --check --file "$file" apps/backend || exit 1; done

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate environment examples
        run: npm run validate:env

      - name: Validate documentation links
        run: npm run validate:docs

      - name: Validate Nx project graph
        run: npm exec nx show projects

      - name: Test OpenAPI bundling
        run: npm exec nx run @blockout/contracts:test

      - name: Lint OpenAPI source
        run: npm exec nx run @blockout/contracts:lint-openapi-source

      - name: Generate contract artifacts
        run: npm exec nx run @blockout/contracts:generate-contracts

      - name: Verify contract artifacts are committed
        run: test -z "$(git status --porcelain -- libs/shared/contracts/generated/specs apps/backend/pom.xml)"

      - name: Generate and verify mobile API clients
        run: npm exec nx run @blockout/mobile:verify-codegen

      - name: Validate mobile form boundary
        run: npm exec nx run @blockout/mobile:validate-form-boundary

      - name: Typecheck reserved contract boundary
        run: npm exec nx run @blockout/contracts:typecheck

      - name: Typecheck mobile application
        run: npm exec nx run @blockout/mobile:typecheck

      - name: Export Android bundle
        run: npm exec nx run @blockout/mobile:export --platform=android

  scrapers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Generate Python API clients twice
        run: |
          npm exec nx run @blockout/contracts:generate-python-clients
          npm exec nx run @blockout/contracts:generate-python-clients --skip-nx-cache

      - name: Verify Python API clients are committed
        run: test -z "$(git status --porcelain -- libs/shared/contracts/clients/python/src)"

      - name: Install local contract client wheel
        run: python -m pip install libs/shared/contracts/clients/python

      - name: Test Python contract client boundary
        run: npm exec nx run @blockout/contracts:test-python-clients

      - name: Validate scraper syntax
        run: |
          python -m compileall -q apps/scrapers/competition-scraper
          python -m compileall -q apps/scrapers/club-scraper

      - name: Build competition scraper image
        run: docker build --file apps/scrapers/competition-scraper/Dockerfile --tag blockout-shadow/competition-scraper:${{ github.sha }} .

      - name: Build club scraper image
        run: docker build --file apps/scrapers/club-scraper/Dockerfile --tag blockout-shadow/club-scraper:${{ github.sha }} .

  local-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate Docker Compose configuration
        run: docker compose --file infra/compose/docker-compose.third-party.yml --file infra/compose/docker-compose.app.yml config --quiet
