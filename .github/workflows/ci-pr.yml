name: CI Pull Request

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Test OpenAPI bundling
        run: npm exec nx run @blockout/contracts:test

      - name: Generate contracts
        run: npm exec nx run @blockout/contracts:generate-contracts

      - name: Verify generated schema mappings are committed
        run: git diff --exit-code -- apps/backend/pom.xml

      - name: Upload OpenAPI bundles
        uses: actions/upload-artifact@v7
        with:
          name: openapi-bundles
          path: libs/shared/contracts/generated/specs/*.json
          if-no-files-found: error

  backend:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v5

      - name: Download OpenAPI bundles
        uses: actions/download-artifact@v8
        with:
          name: openapi-bundles
          path: libs/shared/contracts/generated/specs

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Prepare local backend configuration
        run: |
          for example in apps/backend/*/.env.example; do
            cp "$example" "${example%.example}.local"
          done

      - name: Start backend dependencies
        run: >-
          docker compose
          -f infra/compose/docker-compose.third-party.yml
          -f infra/compose/docker-compose.app.yml
          up -d --wait
          blockout-rabbitmq
          blockout-elasticsearch
          blockout-postgres-pools
          blockout-postgres-teams
          blockout-postgres-matches
          blockout-postgres-competition
          blockout-postgres-users
          blockout-postgres-clubs
          blockout-postgres-config
          blockout-postgres-notification

      - name: Verify backend
        run: mvn -f apps/backend/pom.xml verify

  python:
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - run: npm ci --legacy-peer-deps

      - name: Install Python dependencies
        run: uv sync --locked --all-packages

      - name: Download OpenAPI bundles
        uses: actions/download-artifact@v8
        with:
          name: openapi-bundles
          path: libs/shared/contracts/generated/specs

      - name: Generate Python clients
        run: npm exec nx run @blockout/python-contract-clients:generate

      - name: Test Python clients
        run: npm exec nx run @blockout/python-contract-clients:test

      - name: Lint Python scrapers
        run: npm exec -- nx run-many --targets=lint --projects=@blockout/club-scraper,@blockout/competition-scraper

      - name: Check Python scraper syntax
        run: npm exec -- nx run-many --targets=syntax-check --projects=@blockout/club-scraper,@blockout/competition-scraper

      - name: Test Python scrapers
        run: npm exec -- nx run-many --targets=test --projects=@blockout/club-scraper,@blockout/competition-scraper

  frontend:
    runs-on: ubuntu-latest
    needs: contracts
    env:
      EXPO_PUBLIC_AUTH0_DOMAIN: login.blockout.local
      EXPO_PUBLIC_AUTH0_CLIENT_ID: ci-client
      EXPO_PUBLIC_AUTH0_AUDIENCE: https://api.blockout.local/
      EXPO_PUBLIC_API_GATEWAY_BASE_URL: http://localhost:8089/api/v1/mobile
      EXPO_PUBLIC_API_MATCHES_BASE_URL: http://localhost:8083/api/v1/matches
      EXPO_PUBLIC_API_POOLS_BASE_URL: http://localhost:8081/api/v1/pools
      EXPO_PUBLIC_API_TEAMS_BASE_URL: http://localhost:8082/api/v1/teams
      EXPO_PUBLIC_API_COMPETITIONS_BASE_URL: http://localhost:8084/api/v1/competitions
      EXPO_PUBLIC_API_USERS_BASE_URL: http://localhost:8085/api/v1/users
      EXPO_PUBLIC_API_SEARCH_BASE_URL: http://localhost:8088/api/v1/search
      EXPO_PUBLIC_API_CONFIG_BASE_URL: http://localhost:8090/api/v1/config
      EXPO_PUBLIC_API_CLUBS_BASE_URL: http://localhost:8086/api/v1/clubs
      EXPO_PUBLIC_API_REPORTS_BASE_URL: http://localhost:8091/api/v1/reports
      EXPO_PUBLIC_API_NOTIFICATIONS_BASE_URL: http://localhost:8092/api/v1/notifications
      EXPO_PUBLIC_MAP_URL: https://demotiles.maplibre.org/style.json
      EXPO_PUBLIC_INSTAGRAM_URL: https://www.instagram.com/
      EXPO_PUBLIC_ENTITLEMENT_BLOCKOUT_PRO: blockout_pro
      EXPO_PUBLIC_REVENUECAT_IOS_API_KEY: replace-me
      EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: replace-me
      EXPO_PUBLIC_ADS_BANNER_HOME_ANDROID: ca-app-pub-3940256099942544/6300978111
      EXPO_PUBLIC_ADS_BANNER_HOME_IOS: ca-app-pub-3940256099942544/2934735716
      EXPO_PUBLIC_ADS_BANNER_MATCH_ANDROID: ca-app-pub-3940256099942544/6300978111
      EXPO_PUBLIC_ADS_BANNER_MATCH_IOS: ca-app-pub-3940256099942544/2934735716
      EXPO_PUBLIC_ADS_INTERSTITIAL_NAV_ANDROID: ca-app-pub-3940256099942544/1033173712
      EXPO_PUBLIC_ADS_INTERSTITIAL_NAV_IOS: ca-app-pub-3940256099942544/4411468910
      EXPO_PUBLIC_ADS_INTERSTITIAL_WEB_ANDROID: ca-app-pub-3940256099942544/1033173712
      EXPO_PUBLIC_ADS_INTERSTITIAL_WEB_IOS: ca-app-pub-3940256099942544/4411468910
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Download OpenAPI bundles
        uses: actions/download-artifact@v8
        with:
          name: openapi-bundles
          path: libs/shared/contracts/generated/specs

      - name: Generate mobile client
        run: npm exec nx run @blockout/mobile:codegen

      - name: Lint mobile
        run: npm exec nx run @blockout/mobile:lint

      - name: Typecheck mobile
        run: npm exec nx run @blockout/mobile:typecheck

      - name: Test mobile
        run: npm exec nx run @blockout/mobile:test

      - name: Export mobile bundles
        run: npm exec nx run @blockout/mobile:export
