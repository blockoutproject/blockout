name: Roll back application

on:
  workflow_dispatch:
    inputs:
      component:
        description: Application to restore
        required: true
        type: choice
        options:
          - club-scraper
          - clubs-service
          - competition-scraper
          - competition-service
          - config-service
          - matches-service
          - mobile-gateway
          - notification-service
          - pools-service
          - reports-service
          - search-service
          - search-worker
          - teams-service
          - users-service
      digest:
        description: Previously published sha256 digest
        required: true
        type: string
      revision:
        description: Full source revision carried by the image
        required: true
        type: string

permissions:
  packages: write

jobs:
  rollback:
    name: rollback ${{ inputs.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      DIGEST: ${{ inputs.digest }}
      REVISION: ${{ inputs.revision }}
    steps:
      - name: Validate immutable inputs
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]]

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Restore club-scraper
        if: inputs.component == 'club-scraper'
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_CLUB_SCRAPER_WEBHOOK_URL }}
        run: |
          echo "Restoring $REVISION from $DIGEST"
          docker buildx imagetools create --tag ghcr.io/blockoutproject/blockout-club-scraper:production "ghcr.io/blockoutproject/blockout-club-scraper@$DIGEST"
          curl --fail --silent --show-error --request POST --output /dev/null "$DOKPLOY_WEBHOOK_URL"

      - name: Restore clubs-service
        if: inputs.component == 'clubs-service'
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_CLUBS_SERVICE_WEBHOOK_URL }}
        run: |
          echo "Restoring $REVISION from $DIGEST"
          docker buildx imagetools create --tag ghcr.io/blockoutproject/blockout-clubs-service:production "ghcr.io/blockoutproject/blockout-clubs-service@$DIGEST"
          curl --fail --silent --show-error --request POST --output /dev/null "$DOKPLOY_WEBHOOK_URL"

      - name: Restore competition-scraper
        if: inputs.component == 'competition-scraper'
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_COMPETITION_SCRAPER_WEBHOOK_URL }}
        run: |
          echo "Restoring $REVISION from $DIGEST"
          docker buildx imagetools create --tag ghcr.io/blockoutproject/blockout-competition-scraper:production "ghcr.io/blockoutproject/blockout-competition-scraper@$DIGEST"
          curl --fail --silent --show-error --request POST --output /dev/null "$DOKPLOY_WEBHOOK_URL"

      - name: Restore competition-service
