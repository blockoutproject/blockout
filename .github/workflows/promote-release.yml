name: Promote release

on:
  workflow_dispatch:
    inputs:
      preparation_run_id:
        description: Successful, manually qualified Prepare release run
        type: string
        required: true

permissions:
  contents: read
  actions: read

# Approval runs are serialized; actual deployments stay in Dokploy's native queue.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare main with the qualified source content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREPARATION_RUN_ID: ${{ inputs.preparation_run_id }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          [[ "$PREPARATION_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARATION_RUN_ID" > "$RUNNER_TEMP/preparation.json"
          jq -e '.event == "workflow_dispatch" and .path == ".github/workflows/prepare-release.yml" and .head_branch == "develop" and .conclusion == "success"' "$RUNNER_TEMP/preparation.json"
          revision="$(jq -r .head_sha "$RUNNER_TEMP/preparation.json")"
          git diff --exit-code "$revision" "$GITHUB_SHA"
          printf 'Qualified source %s matches main %s.\n' "$revision" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  promote:
    needs: compare
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.preparation_run_id }}
          pattern: "*-candidate"
          merge-multiple: true
          path: candidate
      - name: Hand off the identical image digests to the Dokploy operator
        run: |
          if test -f candidate/backend.digest; then
            printf 'Set these exact references in Dokploy, then execute the documented native deployment command:\n' >> "$GITHUB_STEP_SUMMARY"
            for application in backend collector migration; do
              printf 'ghcr.io/%s/%s@%s\n' "$GITHUB_REPOSITORY" "$application" "$(cat "candidate/$application.digest")" >> "$GITHUB_STEP_SUMMARY"
            done
          fi
      - name: Hand off the same qualified production builds to the store operator
        run: |
          if test -f candidate/production.json; then
            printf 'Explicitly release these qualified builds through the native store consoles:\n' >> "$GITHUB_STEP_SUMMARY"
            jq -r '.[] | "\(.platform): \(.id)"' candidate/production.json >> "$GITHUB_STEP_SUMMARY"
          fi
