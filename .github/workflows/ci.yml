name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      deployable-projects: ${{ steps.affected.outputs.projects }}
    env:
      EXPO_PUBLIC_ADS_BANNER_HOME_ANDROID: ca-app-pub-3940256099942544/6300978111
      EXPO_PUBLIC_ADS_BANNER_HOME_IOS: ca-app-pub-3940256099942544/2934735716
      EXPO_PUBLIC_ADS_BANNER_MATCH_ANDROID: ca-app-pub-3940256099942544/6300978111
      EXPO_PUBLIC_ADS_BANNER_MATCH_IOS: ca-app-pub-3940256099942544/2934735716
      EXPO_PUBLIC_ADS_INTERSTITIAL_NAV_ANDROID: ca-app-pub-3940256099942544/1033173712
      EXPO_PUBLIC_ADS_INTERSTITIAL_NAV_IOS: ca-app-pub-3940256099942544/4411468910
      EXPO_PUBLIC_ADS_INTERSTITIAL_WEB_ANDROID: ca-app-pub-3940256099942544/1033173712
      EXPO_PUBLIC_ADS_INTERSTITIAL_WEB_IOS: ca-app-pub-3940256099942544/4411468910
      EXPO_PUBLIC_API_CLUBS_BASE_URL: http://localhost:8086/api/v1/clubs
      EXPO_PUBLIC_API_COMPETITIONS_BASE_URL: http://localhost:8084/api/v1/competitions
      EXPO_PUBLIC_API_CONFIG_BASE_URL: http://localhost:8090/api/v1/config
      EXPO_PUBLIC_API_GATEWAY_BASE_URL: http://localhost:8089/api/v1/mobile
      EXPO_PUBLIC_API_MATCHES_BASE_URL: http://localhost:8083/api/v1/matches
      EXPO_PUBLIC_API_NOTIFICATIONS_BASE_URL: http://localhost:8092/api/v1/notifications
      EXPO_PUBLIC_API_POOLS_BASE_URL: http://localhost:8081/api/v1/pools
      EXPO_PUBLIC_API_REPORTS_BASE_URL: http://localhost:8091/api/v1/reports
      EXPO_PUBLIC_API_SEARCH_BASE_URL: http://localhost:8088/api/v1/search
      EXPO_PUBLIC_API_TEAMS_BASE_URL: http://localhost:8082/api/v1/teams
      EXPO_PUBLIC_API_USERS_BASE_URL: http://localhost:8085/api/v1/users
      EXPO_PUBLIC_AUTH0_AUDIENCE: https://api.blockout.local/
      EXPO_PUBLIC_AUTH0_CLIENT_ID: ci-client
      EXPO_PUBLIC_AUTH0_DOMAIN: login.blockout.local
      EXPO_PUBLIC_ENTITLEMENT_BLOCKOUT_PRO: blockout_pro
      EXPO_PUBLIC_INSTAGRAM_URL: https://www.instagram.com/
      EXPO_PUBLIC_MAP_URL: https://demotiles.maplibre.org/style.json
      EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: replace-me
      EXPO_PUBLIC_REVENUECAT_IOS_API_KEY: replace-me
    steps:
      - name: Require develop as the main promotion source
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && (github.head_ref != 'develop' || github.event.pull_request.head.repo.full_name != github.repository)
        run: exit 1

      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the affected range with Nx
        uses: nrwl/nx-set-shas@afb73a62d26e41464e9254689e1fd6122ee683c1 # v5.0.1
        with:
          main-branch-name: ${{ github.base_ref || github.ref_name }}

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Use Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Use uv 0.11.32
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.32"

      - name: Install locked dependencies
        run: npm ci

      - name: Install locked Python dependencies
        run: uv sync --locked --all-packages

      - name: Select deployable projects with Nx
        id: affected
        run: |
          if git diff --name-only "$NX_BASE" "$NX_HEAD" | rg '^(apps/backend/((core-(service|worker)|jobs|migrations)/|pom.xml)|scripts/backend-foundation/|infra/compose/(backend/|docker-compose.backend.yml)|.dockerignore|.github/workflows/ci.yml|nx.json|package(-lock)?.json)' > /dev/null; then
            echo "foundation-changed=true" >> "$GITHUB_OUTPUT"
          fi
          projects=$(npm exec nx -- show projects --affected --base="$NX_BASE" --head="$NX_HEAD" --withTarget=container --json)
          # Replacement images are verified but have no production deployment wiring.
          projects=$(jq -c 'map(select(. != "@blockout/core-service" and . != "@blockout/core-worker"))' <<< "$projects")
          echo "Nx affected deployable projects: $projects"
          jq -e 'all(.[]; . == "@blockout/club-scraper" or . == "@blockout/clubs-service" or . == "@blockout/competition-scraper" or . == "@blockout/competition-service" or . == "@blockout/config-service" or . == "@blockout/matches-service" or . == "@blockout/mobile-gateway" or . == "@blockout/notification-service" or . == "@blockout/pools-service" or . == "@blockout/reports-service" or . == "@blockout/search-service" or . == "@blockout/search-worker" or . == "@blockout/teams-service" or . == "@blockout/users-service")' <<< "$projects" > /dev/null
          echo "projects=$(jq -c . <<< "$projects")" >> "$GITHUB_OUTPUT"

      - name: Verify the complete workspace
        run: npm run verify

      - name: Build affected container images
        run: npm exec nx -- affected -t container --base="$NX_BASE" --head="$NX_HEAD" --parallel=2 --nxBail

      - name: Build affected migration images
        run: npm exec nx -- affected -t migration-container --base="$NX_BASE" --head="$NX_HEAD" --parallel=2 --nxBail

      - name: Verify isolated backend foundation runtime
        if: steps.affected.outputs.foundation-changed == 'true'
        run: |
          trap 'scripts/backend-foundation/local.sh down' EXIT
          scripts/backend-foundation/build.sh
          scripts/backend-foundation/smoke.sh

  release:
    name: release production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.verify.outputs.deployable-projects != '[]'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    env:
      AFFECTED_PROJECTS: ${{ needs.verify.outputs.deployable-projects }}
      CONTAINER_PLATFORM: ${{ vars.CONTAINER_PLATFORM }}
      DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
      DOKPLOY_CLUBS_SERVICE_MIGRATION_SCHEDULE_ID: ${{ vars.DOKPLOY_CLUBS_SERVICE_MIGRATION_SCHEDULE_ID }}
      DOKPLOY_COMPETITION_SERVICE_MIGRATION_SCHEDULE_ID: ${{ vars.DOKPLOY_COMPETITION_SERVICE_MIGRATION_SCHEDULE_ID }}
      DOKPLOY_CONFIG_SERVICE_MIGRATION_SCHEDULE_ID: ${{ vars.DOKPLOY_CONFIG_SERVICE_MIGRATION_SCHEDULE_ID }}
      DOKPLOY_MATCHES_SERVICE_MIGRATION_SCHEDULE_ID: ${{ vars.DOKPLOY_MATCHES_SERVICE_MIGRATION_SCHEDULE_ID }}
      DOKPLOY_NOTIFICATION_SERVICE_MIGRATION_SCHEDULE_ID: ${{ vars.DOKPLOY_NOTIFICATION_SERVICE_MIGRATION_SCHEDULE_ID }}
      DOKPLOY_POOLS_SERVICE_MIGRATION_SCHEDULE_ID: ${{ vars.DOKPLOY_POOLS_SERVICE_MIGRATION_SCHEDULE_ID }}
      DOKPLOY_TEAMS_SERVICE_MIGRATION_SCHEDULE_ID: ${{ vars.DOKPLOY_TEAMS_SERVICE_MIGRATION_SCHEDULE_ID }}
      DOKPLOY_USERS_SERVICE_MIGRATION_SCHEDULE_ID: ${{ vars.DOKPLOY_USERS_SERVICE_MIGRATION_SCHEDULE_ID }}
    steps:
      - name: Check out the verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Use uv 0.11.32 for scraper images
        if: contains(fromJSON(env.AFFECTED_PROJECTS), '@blockout/club-scraper') || contains(fromJSON(env.AFFECTED_PROJECTS), '@blockout/competition-scraper')
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.11.32"

      - name: Install locked dependencies
        run: npm ci

      - name: Install locked Python dependencies for scraper images
        if: contains(fromJSON(env.AFFECTED_PROJECTS), '@blockout/club-scraper') || contains(fromJSON(env.AFFECTED_PROJECTS), '@blockout/competition-scraper')
        run: uv sync --locked --all-packages

      - name: Prepare generated OpenAPI inputs
        run: npm run contracts:generate

      - name: Prepare generated Python clients
        if: contains(fromJSON(env.AFFECTED_PROJECTS), '@blockout/club-scraper') || contains(fromJSON(env.AFFECTED_PROJECTS), '@blockout/competition-scraper')
        run: npm exec nx -- run @blockout/python-contract-clients:generate

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Publish immutable club-scraper image
        if: contains(fromJSON(env.AFFECTED_PROJECTS), '@blockout/club-scraper')
        id: club_scraper_image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/backend/club-scraper/Dockerfile
          platforms: ${{ env.CONTAINER_PLATFORM }}
          push: true
          tags: ghcr.io/blockoutproject/blockout-club-scraper:${{ github.sha }}
          build-args: APP_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Publish immutable clubs-service image
