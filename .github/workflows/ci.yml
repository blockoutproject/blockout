      - name: Publish immutable pools-service migration image
        if: contains(fromJSON(env.AFFECTED_PROJECTS), '@blockout/pools-service')
        id: pools_service_migration_image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
