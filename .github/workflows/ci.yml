name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require develop as the main promotion source
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && (github.head_ref != 'develop' || github.event.pull_request.head.repo.full_name != github.repository)
        run: exit 1

      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Use the workspace npm version
        run: npm install --global npm@12.0.1

      - name: Use Temurin Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Install locked workspace dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify contracts, generated consumers, HTTP boundaries and database roles
        env:
          CI: "true"
          NX_DAEMON: "false"
        run: npm run verify

      - name: Validate native telemetry configuration
        run: |
          telemetry_image=$(docker compose --env-file infra/observability/.env.example -f infra/observability/compose.yaml config --images)
          docker run --rm --env-file infra/observability/.env.example \
            -v "$PWD/infra/observability/config.alloy:/etc/alloy/config.alloy:ro" \
            "$telemetry_image" validate /etc/alloy/config.alloy
