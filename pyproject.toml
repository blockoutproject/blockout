[dependency-groups]
dev = [
    "openapi-generator-cli==7.22.0",
    "pytest==9.1.1",
    "ruff==0.15.22",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.uv]
required-version = "==0.11.32"

[tool.uv.sources]
blockout-contract-clients = { workspace = true }

[tool.uv.workspace]
members = [
    "apps/backend/club-scraper",
    "apps/backend/competition-scraper",
    "libs/shared/python-contract-clients",
]
